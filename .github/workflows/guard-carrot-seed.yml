name: Guard carrot seed until crop rules are defined

on:
  push:
    branches:
      - feat/post-guest-tutorial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-guest-tutorial-upgrades
      - name: Apply focused Garden guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/app/garden.tsx')
          s=p.read_text()
          old='''      const availableSeeds = inventory.filter(i => i.itemType === "seed" && i.quantity > 0);\n      if (availableSeeds.length === 0) {\n        showPlayerBubble('\"I have no seeds.\"');\n        return;\n      }'''
          new='''      // Carrot Seed is introduced in Point 11, but its crop duration/yield are\n      // intentionally not defined yet. Never fall through to the current Herb-only\n      // planting initializer and accidentally turn a Carrot Seed into an herb crop.\n      const availableSeeds = inventory.filter(\n        i => i.itemType === "seed" && i.quantity > 0 && i.id !== "carrotseed",\n      );\n      if (availableSeeds.length === 0) {\n        const hasCarrotSeed = inventory.some(i => i.id === "carrotseed" && i.quantity > 0);\n        showPlayerBubble(hasCarrotSeed\n          ? '\"I should keep the carrot seed for the new plot.\"'\n          : '\"I have no seeds.\"');\n        return;\n      }'''
          if s.count(old)!=1: raise SystemExit(f'matches: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/garden.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Guard Carrot Seed until crop rules are defined"
          git push origin HEAD:feat/post-guest-tutorial-upgrades
