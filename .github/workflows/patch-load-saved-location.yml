name: Patch saved load location

on:
  push:
    branches:
      - fix/load-saved-location
    paths:
      - .github/workflows/patch-load-saved-location.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/load-saved-location
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply saved-location patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1) Snapshot the location metadata with the rest of gameplay state.
          replace_once(
              'frontend/src/game/save-manager.ts',
              '  "@game:unlocked_locs",\n  "@game:player_bag",',
              '  "@game:unlocked_locs",\n  "@game:save_location",\n  "@game:player_bag",',
          )

          # 2) Load-game restores the snapshot first, then routes to its saved location.
          replace_once(
              'frontend/app/game-loading.tsx',
              'import { useSafeAreaInsets } from "react-native-safe-area-context";\n',
              'import { useSafeAreaInsets } from "react-native-safe-area-context";\nimport AsyncStorage from "@react-native-async-storage/async-storage";\n',
          )
          replace_once(
              'frontend/app/game-loading.tsx',
              '    const failures: string[] = [];\n    let cancelled = false;\n',
              '    const failures: string[] = [];\n    let cancelled = false;\n    let restoredLocation: "kitchen" | "garden" | "dormitory" = "kitchen";\n',
          )
          replace_once(
              'frontend/app/game-loading.tsx',
              '          await restoreFromSnapshot(slotId);\n',
              '          await restoreFromSnapshot(slotId);\n          const savedLocation = await AsyncStorage.getItem("@game:save_location");\n          if (savedLocation === "kitchen" || savedLocation === "garden" || savedLocation === "dormitory") {\n            restoredLocation = savedLocation;\n          }\n',
          )
          replace_once(
              'frontend/app/game-loading.tsx',
              '      } else {\n        router.replace("/kitchen");\n      }\n',
              '      } else if (restoredLocation === "dormitory") {\n        router.replace({ pathname: "/dormitory", params: { loadedFromSave: "1" } });\n      } else if (restoredLocation === "garden") {\n        router.replace({ pathname: "/garden", params: { loadedFromSave: "1" } });\n      } else {\n        router.replace("/kitchen");\n      }\n',
          )

          # 3) Dormitory day-transition/manual saves resume in the room.
          replace_once(
              'frontend/app/dormitory.tsx',
              'import { useRouter } from "expo-router";\n',
              'import { useLocalSearchParams, useRouter } from "expo-router";\n',
          )
          replace_once(
              'frontend/app/dormitory.tsx',
              '  GAME_SLOTS:            "game_slots",\n',
              '  GAME_SLOTS:            "game_slots",\n  SAVE_LOCATION:         "@game:save_location",\n',
          )
          replace_once(
              'frontend/app/dormitory.tsx',
              '  const router = useRouter();\n  const insets = useSafeAreaInsets();\n',
              '  const router = useRouter();\n  const params = useLocalSearchParams<{ loadedFromSave?: string }>();\n  const insets = useSafeAreaInsets();\n',
          )
          replace_once(
              'frontend/app/dormitory.tsx',
              '      // ── 7. Save slot (with final new values) + create checkpoint snapshot\n      const slotNum = await updateSaveSlot(newDay, newSta, newLife);\n',
              '      // ── 7. Save slot (with final new values) + create checkpoint snapshot\n      // A day-transition checkpoint represents waking up in the Dormitory.\n      await AsyncStorage.setItem(DSK.SAVE_LOCATION, "dormitory");\n      const slotNum = await updateSaveSlot(newDay, newSta, newLife);\n',
          )
          replace_once(
              'frontend/app/dormitory.tsx',
              '      if (slotNum > 0) {\n        await createSnapshot(slotNum, "manual");\n      }\n      showPlayerBubble(\'"Game saved."\', 2000);\n',
              '      if (slotNum > 0) {\n        await AsyncStorage.setItem(DSK.SAVE_LOCATION, "dormitory");\n        await createSnapshot(slotNum, "manual");\n      }\n      showPlayerBubble(\'"Game saved."\', 2000);\n',
          )
          replace_once(
              'frontend/app/dormitory.tsx',
              '  function afterDownstairsFade() {\n    audioManager.stopSoundEffect(\'walking-on-wood\');\n    router.back();\n  }\n',
              '  function afterDownstairsFade() {\n    audioManager.stopSoundEffect(\'walking-on-wood\');\n    if (params.loadedFromSave === "1") router.replace("/kitchen");\n    else router.back();\n  }\n',
          )

          # 4) Kitchen manual saves explicitly resume in Kitchen.
          replace_once(
              'frontend/app/kitchen.tsx',
              '  CRAFT_TOOL_SLOT:   "@kitchen:craft_tool_slot",\n',
              '  CRAFT_TOOL_SLOT:   "@kitchen:craft_tool_slot",\n  SAVE_LOCATION:     "@game:save_location",\n',
          )
          replace_once(
              'frontend/app/kitchen.tsx',
              '      await AsyncStorage.setItem("game_slots", JSON.stringify(updated));\n      await createSnapshot(slotNum, "manual");\n',
              '      await AsyncStorage.setItem("game_slots", JSON.stringify(updated));\n      await AsyncStorage.setItem(SK.SAVE_LOCATION, "kitchen");\n      await createSnapshot(slotNum, "manual");\n',
          )

          # 5) Garden manual saves resume in Garden and can leave safely after direct load.
          replace_once(
              'frontend/app/garden.tsx',
              'import { useRouter } from "expo-router";\n',
              'import { useLocalSearchParams, useRouter } from "expo-router";\n',
          )
          replace_once(
              'frontend/app/garden.tsx',
              '  CRAFTING_READY:     "@garden:crafting_tutorial_ready",\n',
              '  CRAFTING_READY:     "@garden:crafting_tutorial_ready",\n  SAVE_LOCATION:      "@game:save_location",\n',
          )
          replace_once(
              'frontend/app/garden.tsx',
              '  const router = useRouter();\n  const insets = useSafeAreaInsets();\n',
              '  const router = useRouter();\n  const params = useLocalSearchParams<{ loadedFromSave?: string }>();\n  const insets = useSafeAreaInsets();\n',
          )
          replace_once(
              'frontend/app/garden.tsx',
              '      await AsyncStorage.setItem("game_slots", JSON.stringify(updated));\n      await createSnapshot(slotNum, "manual");\n',
              '      await AsyncStorage.setItem("game_slots", JSON.stringify(updated));\n      await AsyncStorage.setItem(GSK.SAVE_LOCATION, "garden");\n      await createSnapshot(slotNum, "manual");\n',
          )
          replace_once(
              'frontend/app/garden.tsx',
              '    audioManager.playSoundEffect(\'footstep\', { maxDurationMs: 4000 });\n    router.back();\n',
              '    audioManager.playSoundEffect(\'footstep\', { maxDurationMs: 4000 });\n    if (params.loadedFromSave === "1") router.replace("/kitchen");\n    else router.back();\n',
          )
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate changed screens
        working-directory: frontend
        run: |
          npx eslint app/game-loading.tsx app/dormitory.tsx app/kitchen.tsx app/garden.tsx src/game/save-manager.ts
          npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/game-loading.tsx frontend/app/dormitory.tsx frontend/app/kitchen.tsx frontend/app/garden.tsx frontend/src/game/save-manager.ts
          git diff --cached --quiet && exit 0
          git commit -m "Resume saves at their saved gameplay location"
          git push
