name: Apply guest tutorial service flow

on:
  push:
    branches:
      - feat/guest-tutorial-service

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guest-tutorial-service
          fetch-depth: 0

      - name: Apply focused Point 10 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = {
            'tutorial': Path('frontend/src/game/guest-tutorial.ts'),
            'guestcard': Path('frontend/src/components/GuestCard.tsx'),
            'dining': Path('frontend/app/dining.tsx'),
            'kitchen': Path('frontend/app/kitchen.tsx'),
            'garden': Path('frontend/app/garden.tsx'),
          }
          texts = {k: p.read_text() for k,p in paths.items()}

          def rep(name, old, new, label):
            c = texts[name].count(old)
            if c != 1:
              raise SystemExit(f'{label}: expected 1 match, found {c}')
            texts[name] = texts[name].replace(old, new, 1)

          # ── guest-tutorial.ts: extend persistent Point 10 steps + shared Rupert helper.
          rep('tutorial',
'''  | "meal_reveal"\n  | "ready_for_water";''',
'''  | "meal_reveal"\n  | "ready_for_water"\n  | "service_sell"\n  | "service_exchange"\n  | "service_water"\n  | "service_talk"\n  | "service_reaction"\n  | "service_departing"\n  | "service_complete";''',
'extend guest tutorial type')

          rep('tutorial',
'''  "meal_reveal",\n  "ready_for_water",\n]);''',
'''  "meal_reveal",\n  "ready_for_water",\n  "service_sell",\n  "service_exchange",\n  "service_water",\n  "service_talk",\n  "service_reaction",\n  "service_departing",\n  "service_complete",\n]);''',
'extend valid guest tutorial steps')

          rep('tutorial',
'''    "meal_reveal",\n    "ready_for_water",\n  ];''',
'''    "meal_reveal",\n    "ready_for_water",\n    "service_sell",\n    "service_exchange",\n    "service_water",\n    "service_talk",\n    "service_reaction",\n    "service_departing",\n    "service_complete",\n  ];''',
'extend guest tutorial ordering')

          texts['tutorial'] += '''\n\n/** Rupert remains with the guest until the first service tutorial has fully ended. */\nexport function guestTutorialKeepsRupertInDining(step: GuestTutorialIntroStep): boolean {\n  return step === "ready_for_water" ||\n    step === "service_sell" ||\n    step === "service_exchange" ||\n    step === "service_water" ||\n    step === "service_talk" ||\n    step === "service_reaction" ||\n    step === "service_departing";\n}\n'''

          # ── Kitchen/Garden: keep Part 9 restrictions active through the whole service flow.
          rep('kitchen',
'''import { loadGuestTutorialIntroStep, saveGuestTutorialIntroStep } from "@/src/game/guest-tutorial";''',
'''import {\n  guestTutorialKeepsRupertInDining,\n  loadGuestTutorialIntroStep,\n  saveGuestTutorialIntroStep,\n} from "@/src/game/guest-tutorial";''',
'Kitchen guest tutorial import')
          rep('kitchen',
'''      setRupertInDining(step === "ready_for_water");''',
'''      setRupertInDining(guestTutorialKeepsRupertInDining(step));''',
'Kitchen Rupert dining state')

