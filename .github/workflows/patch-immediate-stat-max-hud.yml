name: Patch immediate stat max HUD

on:
  push:
    branches:
      - fix/immediate-stat-max-hud
    paths:
      - .github/workflows/patch-immediate-stat-max-hud.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/immediate-stat-max-hud
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch Garden and Dormitory stat maxima
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # ── Garden ──────────────────────────────────────────────────────────
          path = Path("frontend/app/garden.tsx")
          text = path.read_text()

          text = replace_once(
              text,
              '  const [staminaCurrent, setStaminaCurrent] = useState(40);\n  const staminaMax = 100;\n  const [staminaDisplay, setStaminaDisplay] = useState(40);',
              '  const [staminaCurrent, setStaminaCurrent] = useState(40);\n  const [staminaDisplay, setStaminaDisplay] = useState(40);',
              'garden remove fixed stamina max',
          )

          text = replace_once(
              text,
              '  const barWidthSV   = useSharedValue(0);\n  const staminaSV    = useSharedValue(40);\n  const plotOpacity  = useSharedValue(0);',
              '  const barWidthSV   = useSharedValue(0);\n  const staminaSV    = useSharedValue(40);\n  const staminaMaxSV = useSharedValue(DEFAULT_PLAYER_STATS.maximumStamina);\n  const plotOpacity  = useSharedValue(0);',
              'garden stamina max shared value',
          )

          text = replace_once(
              text,
              '  const staminaFillStyle = useAnimatedStyle(() => ({\n    width: (staminaSV.value / 100) * barWidthSV.value,\n  }));',
              '  const staminaFillStyle = useAnimatedStyle(() => ({\n    width: (staminaSV.value / staminaMaxSV.value) * barWidthSV.value,\n  }));',
              'garden dynamic stamina bar denominator',
          )

          text = replace_once(
              text,
              '  useEffect(() => { gtsRef.current = gts; }, [gts]);\n  // Keep bag ref in sync to prevent stale closures in async gift flows',
              '  useEffect(() => { gtsRef.current = gts; }, [gts]);\n  useEffect(() => {\n    staminaMaxSV.value = playerStats.maximumStamina;\n  }, [playerStats.maximumStamina, staminaMaxSV]);\n  // Keep bag ref in sync to prevent stale closures in async gift flows',
              'garden sync max stamina shared value',
          )

          text = replace_once(
              text,
              '        // Load stamina\n        const rawSta = await AsyncStorage.getItem(GSK.STAMINA);\n        const sta = rawSta ? Math.min(Math.max(parseInt(rawSta, 10), 0), 100) : 40;',
              '        // Load player stats before current values so upgraded maxima are respected.\n        let loadedStats = DEFAULT_PLAYER_STATS;\n        const rawStats = await AsyncStorage.getItem(PLAYER_STATS_KEY);\n        if (rawStats) {\n          try { loadedStats = { ...DEFAULT_PLAYER_STATS, ...JSON.parse(rawStats) }; } catch { /* default */ }\n        }\n        setPlayerStats(loadedStats);\n        staminaMaxSV.value = loadedStats.maximumStamina;\n\n        // Load stamina\n        const rawSta = await AsyncStorage.getItem(GSK.STAMINA);\n        const sta = rawSta ? Math.min(Math.max(parseInt(rawSta, 10), 0), loadedStats.maximumStamina) : 40;',
              'garden load stats before stamina',
          )

          text = replace_once(
              text,
              '        const lf = rawLife ? Math.min(Math.max(parseInt(rawLife, 10), 0), 30) : 15;',
              '        const lf = rawLife ? Math.min(Math.max(parseInt(rawLife, 10), 0), loadedStats.maximumLife) : 15;',
              'garden dynamic life load clamp',
          )

          text = replace_once(
              text,
              '        // Load player bag & stats\n        const rawBag = await AsyncStorage.getItem(PLAYER_BAG_KEY);\n        if (rawBag) { try { setPlayerBag(JSON.parse(rawBag)); } catch { /* default */ } }\n        const rawStats = await AsyncStorage.getItem(PLAYER_STATS_KEY);\n        if (rawStats) { try { setPlayerStats(JSON.parse(rawStats)); } catch { /* default */ } }',
              '        // Load player bag\n        const rawBag = await AsyncStorage.getItem(PLAYER_BAG_KEY);\n        if (rawBag) { try { setPlayerBag(JSON.parse(rawBag)); } catch { /* default */ } }',
              'garden remove duplicate stats load',
          )

          text = replace_once(
              text,
              '  async function handleStatsUpdated(newStats: PlayerStats, newCurrentLife: number | null) {\n    setPlayerStats(newStats);\n    if (newCurrentLife !== null) setLifeCurrent(newCurrentLife);',
              '  async function handleStatsUpdated(newStats: PlayerStats, newCurrentLife: number | null) {\n    setPlayerStats(newStats);\n    staminaMaxSV.value = newStats.maximumStamina;\n    if (newCurrentLife !== null) setLifeCurrent(newCurrentLife);',
              'garden immediate max stamina callback sync',
          )

          text = replace_once(
              text,
              '<Text style={styles.statBarText}>{staminaDisplay}/{staminaMax}</Text>',
              '<Text style={styles.statBarText}>{staminaDisplay}/{playerStats.maximumStamina}</Text>',
              'garden stamina HUD text',
          )

          text = replace_once(
              text,
              '<View style={[styles.statBarFill, styles.lifeFill, { width: (lifeCurrent / 30) * (barWidth || 0) }]} />\n              </View>\n              <Text style={styles.statBarText}>{lifeCurrent}/30</Text>',
              '<View style={[styles.statBarFill, styles.lifeFill, { width: (lifeCurrent / playerStats.maximumLife) * (barWidth || 0) }]} />\n              </View>\n              <Text style={styles.statBarText}>{lifeCurrent}/{playerStats.maximumLife}</Text>',
              'garden dynamic life HUD',
          )

          path.write_text(text)

          # ── Dormitory ───────────────────────────────────────────────────────
          path = Path("frontend/app/dormitory.tsx")
          text = path.read_text()

          text = replace_once(
              text,
              'const DAYS = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"] as const;\nconst LIFE_MAX  = 30;\nconst STA_MAX   = 100;',
              'const DAYS = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"] as const;',
              'dormitory remove fixed stat maxima',
          )

          text = replace_once(
              text,
              '  const staminaSV    = useSharedValue(40);\n  const lifeSV       = useSharedValue(15);   // for animated life bar\n  const barWidthSV   = useSharedValue(0);',
              '  const staminaSV    = useSharedValue(40);\n  const lifeSV       = useSharedValue(15);   // for animated life bar\n  const staminaMaxSV = useSharedValue(DEFAULT_PLAYER_STATS.maximumStamina);\n  const lifeMaxSV    = useSharedValue(DEFAULT_PLAYER_STATS.maximumLife);\n  const barWidthSV   = useSharedValue(0);',
              'dormitory max shared values',
          )

          text = replace_once(
              text,
              '  const staminaFillStyle = useAnimatedStyle(() => ({\n    width: (staminaSV.value / STA_MAX) * barWidthSV.value,\n  }));\n  const lifeFillStyle = useAnimatedStyle(() => ({\n    width: (lifeSV.value / LIFE_MAX) * barWidthSV.value,\n  }));',
              '  const staminaFillStyle = useAnimatedStyle(() => ({\n    width: (staminaSV.value / staminaMaxSV.value) * barWidthSV.value,\n  }));\n  const lifeFillStyle = useAnimatedStyle(() => ({\n    width: (lifeSV.value / lifeMaxSV.value) * barWidthSV.value,\n  }));',
              'dormitory dynamic bar denominators',
          )

          text = replace_once(
              text,
              '  function setRS(s: RoomState) { roomStateRef.current = s; setRoomState(s); }\n\n  // ─────────────────────────────────────────────────────────────────────────\n  // Morning birds:',
              '  function setRS(s: RoomState) { roomStateRef.current = s; setRoomState(s); }\n\n  useEffect(() => {\n    staminaMaxSV.value = playerStats.maximumStamina;\n    lifeMaxSV.value = playerStats.maximumLife;\n  }, [playerStats.maximumStamina, playerStats.maximumLife, staminaMaxSV, lifeMaxSV]);\n\n  // ─────────────────────────────────────────────────────────────────────────\n  // Morning birds:',
              'dormitory sync max shared values',
          )

          text = replace_once(
              text,
              '        // Stamina\n        const rawSta = await AsyncStorage.getItem(DSK.STAMINA);\n        const sta = rawSta ? Math.min(Math.max(parseInt(rawSta, 10), 0), STA_MAX) : 40;\n        setStaminaCurrent(sta); setStaminaDisplay(sta); staminaSV.value = sta;\n\n        // Life\n        const rawLife = await AsyncStorage.getItem(DSK.LIFE);\n        const lf = rawLife ? Math.min(Math.max(parseInt(rawLife, 10), 0), LIFE_MAX) : 15;\n        setLifeCurrent(lf);\n        lifeSV.value = lf;\n\n        // Player stats / Growth Points\n        const rawStats = await AsyncStorage.getItem(PLAYER_STATS_KEY);\n        if (rawStats) {\n          try { setPlayerStats(JSON.parse(rawStats)); } catch { /* default */ }\n        }',
              '        // Player stats / Growth Points must load first so current values use upgraded caps.\n        let loadedStats = DEFAULT_PLAYER_STATS;\n        const rawStats = await AsyncStorage.getItem(PLAYER_STATS_KEY);\n        if (rawStats) {\n          try { loadedStats = { ...DEFAULT_PLAYER_STATS, ...JSON.parse(rawStats) }; } catch { /* default */ }\n        }\n        setPlayerStats(loadedStats);\n        staminaMaxSV.value = loadedStats.maximumStamina;\n        lifeMaxSV.value = loadedStats.maximumLife;\n\n        // Stamina\n        const rawSta = await AsyncStorage.getItem(DSK.STAMINA);\n        const sta = rawSta ? Math.min(Math.max(parseInt(rawSta, 10), 0), loadedStats.maximumStamina) : 40;\n        setStaminaCurrent(sta); setStaminaDisplay(sta); staminaSV.value = sta;\n\n        // Life\n        const rawLife = await AsyncStorage.getItem(DSK.LIFE);\n        const lf = rawLife ? Math.min(Math.max(parseInt(rawLife, 10), 0), loadedStats.maximumLife) : 15;\n        setLifeCurrent(lf);\n        lifeSV.value = lf;',
              'dormitory load stats before current values',
          )

          text = text.replace('Math.min(oldSta + recovery.stamina, STA_MAX)', 'Math.min(oldSta + recovery.stamina, playerStats.maximumStamina)')
          text = text.replace('Math.min(oldLife + recovery.life, LIFE_MAX)', 'Math.min(oldLife + recovery.life, playerStats.maximumLife)')
          if 'STA_MAX' in text or 'LIFE_MAX' in text:
              raise SystemExit('dormitory fixed max constants still referenced')

          text = replace_once(
              text,
              '<Text style={styles.statBarText}>{staminaDisplay}/{STA_MAX}</Text>',
              '<Text style={styles.statBarText}>{staminaDisplay}/{playerStats.maximumStamina}</Text>',
              'dormitory stamina HUD text',
          ) if '<Text style={styles.statBarText}>{staminaDisplay}/{STA_MAX}</Text>' in text else text

          # The previous global replacement check removes STA_MAX references only after HUD replacement,
          # so handle the dynamic HUD strings directly if constants were already removed from earlier steps.
          text = text.replace('{staminaDisplay}/{STA_MAX}', '{staminaDisplay}/{playerStats.maximumStamina}')
          text = text.replace('{lifeCurrent}/{LIFE_MAX}', '{lifeCurrent}/{playerStats.maximumLife}')

          text = replace_once(
              text,
              '        onStatsUpdated={(newStats, newLife) => {\n          setPlayerStats(newStats);\n          if (newLife !== null) {',
              '        onStatsUpdated={(newStats, newLife) => {\n          setPlayerStats(newStats);\n          staminaMaxSV.value = newStats.maximumStamina;\n          lifeMaxSV.value = newStats.maximumLife;\n          if (newLife !== null) {',
              'dormitory immediate callback sync',
          )

          # Final guards / desired HUD text. Since constants were removed, replace any remaining literal 100/30 HUD forms if present.
          text = text.replace('{staminaDisplay}/100', '{staminaDisplay}/{playerStats.maximumStamina}')
          text = text.replace('{lifeCurrent}/30', '{lifeCurrent}/{playerStats.maximumLife}')

          path.write_text(text)
          PY

      - name: Assert scope and dynamic maxima
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g = Path('frontend/app/garden.tsx').read_text()
          d = Path('frontend/app/dormitory.tsx').read_text()
          assert 'const staminaMax = 100;' not in g
          assert 'staminaSV.value / 100' not in g
          assert '{staminaDisplay}/{playerStats.maximumStamina}' in g
          assert 'lifeCurrent / playerStats.maximumLife' in g
          assert 'staminaMaxSV.value = newStats.maximumStamina' in g
          assert 'STA_MAX' not in d
          assert 'LIFE_MAX' not in d
          assert 'staminaSV.value / staminaMaxSV.value' in d
          assert 'lifeSV.value / lifeMaxSV.value' in d
          assert '{staminaDisplay}/{playerStats.maximumStamina}' in d
          assert '{lifeCurrent}/{playerStats.maximumLife}' in d
          assert 'playerStats.maximumStamina' in d
          assert 'playerStats.maximumLife' in d
          PY

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate changed screens
        working-directory: frontend
        run: |
          npx eslint app/garden.tsx app/dormitory.tsx
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/garden.tsx frontend/app/dormitory.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Update stat maxima immediately in HUD"
          git push origin HEAD:fix/immediate-stat-max-hud
