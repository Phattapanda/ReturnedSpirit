name: Correct Dining dawn state after service tutorial

on:
  push:
    branches:
      - feat/guest-tutorial-service

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guest-tutorial-service
      - name: Apply focused correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/app/dining.tsx')
          s = p.read_text()
          old = '  const useDawnBackground = tutorialInDining || timeOfDay === "morning";'
          new = '  const useDawnBackground = (tutorialInDining && tutorialStep !== "service_complete") || timeOfDay === "morning";'
          if s.count(old) != 1:
              raise SystemExit(f'expected 1 match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/dining.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop forcing Dining dawn after guest service tutorial"
          git push origin HEAD:feat/guest-tutorial-service
