name: Adjust Rupert upgrade dialogue

on:
  push:
    branches:
      - feat/post-guest-tutorial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-guest-tutorial-upgrades
      - name: Apply focused dialogue wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/app/kitchen.tsx')
          s = p.read_text()
          replacements = [
            (
              '"From now on, tap me whenever you want to improve the tavern or its grounds."',
              '"You can always talk to me if you want to change something."',
            ),
            (
              '"A second garden plot is a simple start. It needs 4 Wood and 4 Stone."',
              '"If we have more mouths to feed, we need a second garden bed."',
            ),
            (
              '>Tavern & grounds<',
              '>Tavern & Garden<',
            ),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly 1 match for {old!r}, found {count}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep Rupert upgrade dialogue in world"
          git push origin HEAD:feat/post-guest-tutorial-upgrades
