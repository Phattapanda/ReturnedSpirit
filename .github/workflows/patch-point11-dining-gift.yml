name: Apply Farmer carrot seed gift

on:
  push:
    branches:
      - feat/post-guest-tutorial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-guest-tutorial-upgrades
      - name: Patch Dining gift flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/app/dining.tsx')
          s=p.read_text()
          def rep(old,new,label):
            global s
            c=s.count(old)
            if c!=1: raise SystemExit(f'{label}: {c}')
            s=s.replace(old,new,1)

          rep('''import { setActiveGuest, type GuestVisitView } from "@/src/game/guest-system";\nimport { createSnapshot, discardRuntimeAndRestore } from "@/src/game/save-manager";''', '''import { setActiveGuest, type GuestVisitView } from "@/src/game/guest-system";\nimport {\n  grantFarmerCarrotSeedOnce,\n  loadPostGuestTutorialState,\n  markSecondPlotThoughtSeen,\n} from "@/src/game/post-guest-tutorial";\nimport { createSnapshot, discardRuntimeAndRestore } from "@/src/game/save-manager";''', 'post guest import')

          rep('''  coin_copper:   require("../assets/images/coin_copper.png"),''', '''  coin_copper:   require("../assets/images/coin_copper.png"),\n  carrotseed:    require("../assets/images/carrotseed.png"),''', 'carrot seed asset')

          rep('''function serviceReaction(): TutorialLine[] {\n  return [\n    { speaker: "Old Farmer", portrait: "old_farmer", text: '\"That hit the spot. I\\'ll come back soon.\"' },\n    { speaker: "Rupert", portrait: "rupert_laugh", text: '\"Not bad for your first guest.\"' },\n  ];\n}''', '''function serviceReaction(): TutorialLine[] {\n  return [\n    { speaker: "Old Farmer", portrait: "old_farmer", text: '\"That hit the spot. I\\'ll come back soon.\"' },\n    { speaker: "Old Farmer", portrait: "old_farmer", text: '\"Before I go, take this carrot seed. Maybe you can find some space for it.\"' },\n    { speaker: "Rupert", portrait: "rupert_laugh", text: '\"Not bad for your first guest.\"' },\n  ];\n}''', 'gift dialogue')

          rep('''        } else if (loadedTutorialStep === "service_departing") {\n          setTutorialStep("service_departing");\n          setDepartingGuestId("old_farmer");\n          setTimeout(async () => {\n            await setActiveGuest(null);\n            await saveGuestTutorialIntroStep("service_complete");\n            if (active) {\n              setTutorialStep("service_complete");\n              setDepartingGuestId(null);\n            }\n          }, 720);\n        } else {''', '''        } else if (loadedTutorialStep === "service_departing") {\n          await grantFarmerCarrotSeedOnce();\n          setTutorialStep("service_departing");\n          setDepartingGuestId("old_farmer");\n          setTimeout(async () => {\n            await setActiveGuest(null);\n            await saveGuestTutorialIntroStep("service_complete");\n            const postState = await loadPostGuestTutorialState();\n            if (active) {\n              setTutorialStep("service_complete");\n              setDepartingGuestId(null);\n              if (!postState.secondPlotThoughtSeen) {\n                setTimeout(() => showPlayerThought("I could use a second garden bed for the carrot seed."), 250);\n                await markSecondPlotThoughtSeen();\n              }\n            }\n          }, 720);\n        } else if (loadedTutorialStep === "service_complete") {\n          // Save migration: Part 10 may already have been completed before the\n          // Farmer gift existed. Grant it once without forcing a replay.\n          await grantFarmerCarrotSeedOnce();\n          const postState = await loadPostGuestTutorialState();\n          setTutorialStep("service_complete");\n          if (!postState.secondPlotThoughtSeen) {\n            setTimeout(() => showPlayerThought("I could use a second garden bed for the carrot seed."), 450);\n            await markSecondPlotThoughtSeen();\n          }\n        } else {''', 'load gift migration')

          rep('''    if (tutorialStep === "service_reaction") {\n      await saveGuestTutorialIntroStep("service_departing");''', '''    if (tutorialStep === "service_reaction") {\n      await grantFarmerCarrotSeedOnce();\n      await saveGuestTutorialIntroStep("service_departing");''', 'grant gift before departure')

          rep('''        await saveGuestTutorialIntroStep("service_complete");\n        setTutorialStep("service_complete");\n        setDepartingGuestId(null);\n      }, 720);''', '''        await saveGuestTutorialIntroStep("service_complete");\n        setTutorialStep("service_complete");\n        setDepartingGuestId(null);\n        const postState = await loadPostGuestTutorialState();\n        if (!postState.secondPlotThoughtSeen) {\n          showPlayerThought("I could use a second garden bed for the carrot seed.");\n          await markSecondPlotThoughtSeen();\n        }\n      }, 720);''', 'thought after departure')

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/dining.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Give Farmer carrot seed after first service"
          git push origin HEAD:feat/post-guest-tutorial-upgrades
