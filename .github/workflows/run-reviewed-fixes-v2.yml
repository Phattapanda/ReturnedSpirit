name: Run reviewed fixes v2

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/ui-bubble-portrait-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Run resilient reviewed patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          raw = Path('.github/workflows/reviewed-ui-navigation-fixes.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          block = raw[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )

          old_helper = '''def replace(text: str, old: str, new: str, label: str) -> str:
    if old in text:
        return text.replace(old, new, 1)
    if new in text:
        return text
    raise SystemExit(f"missing {label}")'''

          new_helper = r'''def replace(text: str, old: str, new: str, label: str) -> str:
    if old in text:
        return text.replace(old, new, 1)
    if new in text:
        return text
    if label == "Kitchen focus refresh":
        focus_start = text.find('          const cur = tsRef.current;')
        guest_start = text.find('          const guestStep = await loadGuestTutorialIntroStep();', focus_start)
        focus_end = text.find('\n\n          // Refresh stats', guest_start)
        if focus_start >= 0 and guest_start >= 0 and focus_end >= 0:
            return text[:focus_start] + new + text[focus_end:]
    if label == "stable prompt buttons":
        prompt_start = text.find('          if (enabledInGardenPrompt) {')
        prompt_end = text.find('          // In Tuesday kitchen state', prompt_start)
        if prompt_start >= 0 and prompt_end >= 0:
            return text[:prompt_start] + new + "\n\n" + text[prompt_end:]
    raise SystemExit(f"missing {label}")'''

          if old_helper not in script:
              raise SystemExit('reviewed patch helper not found')
          script = script.replace(old_helper, new_helper, 1)
          exec(compile(script, '/tmp/reviewed-ui-navigation-fixes.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate TypeScript and focused lint
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint \
            src/KitchenScreenBase.tsx \
            src/GardenScreenBase.tsx \
            src/components/GuestTutorialDialog.tsx \
            app/dining.tsx \
            app/intro.tsx
          git diff --check

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/reviewed-ui-navigation-fixes.yml \
            .github/workflows/run-reviewed-fixes-on-pr.yml \
            .github/workflows/run-reviewed-fixes-v2.yml \
            .github/workflows/run-reviewed-fixes-sync.yml \
            .github/reviewed-fixes-trigger.txt
          git add frontend
          git commit -m "Fix reviewed tutorial UI drag and navigation issues"
          git push origin HEAD:fix/ui-bubble-portrait-polish
