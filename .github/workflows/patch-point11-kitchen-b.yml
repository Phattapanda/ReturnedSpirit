name: Patch Kitchen post guest upgrade behavior

on:
  push:
    branches:
      - feat/post-guest-tutorial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-guest-tutorial-upgrades
      - name: Patch behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/app/kitchen.tsx')
          s=p.read_text()
          def rep(old,new,label):
            global s
            c=s.count(old)
            if c!=1: raise SystemExit(f'{label}: {c}')
            s=s.replace(old,new,1)

          rep('''      cookingTutorialCompletedRef.current = cookingDone === "true";\n      if (cookingDone !== "true") return;\n      const step = await loadGuestTutorialIntroStep();''', '''      cookingTutorialCompletedRef.current = cookingDone === "true";\n      if (cookingDone !== "true") {\n        if (active) setRupertInDining(false);\n        return;\n      }\n      const step = await loadGuestTutorialIntroStep();''', 'guest effect early reset')

          rep('''      setRupertInDining(guestTutorialKeepsRupertInDining(step));\n      if (step === "not_started" || step === "knock") {''', '''      setRupertInDining(guestTutorialKeepsRupertInDining(step));\n      if (step === "service_complete") {\n        void maybeStartPostGuestUpgradeIntro(300);\n      }\n      if (step === "not_started" || step === "knock") {''', 'guest effect upgrade intro')

          rep('''        const done = await AsyncStorage.getItem(SK.TUTORIAL_DONE);\n        const name = await AsyncStorage.getItem(SK.PLAYER_NAME);''', '''        const done = await AsyncStorage.getItem(SK.TUTORIAL_DONE);\n        const initialCookingDone = await AsyncStorage.getItem(SK.COOKING_DONE);\n        cookingTutorialCompletedRef.current = initialCookingDone === "true";\n        if (initialCookingDone === "true") {\n          const initialGuestStep = await loadGuestTutorialIntroStep();\n          setRupertInDining(guestTutorialKeepsRupertInDining(initialGuestStep));\n        } else {\n          setRupertInDining(false);\n        }\n        const name = await AsyncStorage.getItem(SK.PLAYER_NAME);''', 'initial Rupert placement')

          marker='''  /** Start the Day-2 Kitchen prompt once the Kitchen is in a stable IDLE state. */\n  async function maybeStartTuesdayMorningTutorial'''
          insert='''  async function refreshPostGuestResources() {\n    const state = await loadPostGuestTutorialState();\n    setPostGuestState(state);\n    const rawResources = await AsyncStorage.getItem(SHARED_RESOURCES_KEY);\n    if (rawResources) {\n      try { setSharedResources({ ...SHARED_RESOURCE_DEFAULTS, ...JSON.parse(rawResources) }); }\n      catch { setSharedResources({ ...SHARED_RESOURCE_DEFAULTS }); }\n    } else {\n      setSharedResources({ ...SHARED_RESOURCE_DEFAULTS });\n    }\n    return state;\n  }\n\n  async function maybeStartPostGuestUpgradeIntro(delayMs = 300): Promise<boolean> {\n    if (tsRef.current !== "IDLE" || postGuestIntroStartedRef.current) return false;\n    const guestStep = await loadGuestTutorialIntroStep();\n    if (guestStep !== "service_complete") return false;\n\n    // Save migration: Part 10 may already be complete before Point 11 is pulled.\n    await grantFarmerCarrotSeedOnce();\n    const state = await refreshPostGuestResources();\n    if (state.upgradeIntroSeen) return false;\n\n    postGuestIntroStartedRef.current = true;\n    setTimeout(() => {\n      if (tsRef.current !== "IDLE") {\n        postGuestIntroStartedRef.current = false;\n        return;\n      }\n      showDialog(D_UPGRADE_INTRO, async () => {\n        const next = await markUpgradeIntroSeen();\n        setPostGuestState(next);\n        postGuestIntroStartedRef.current = false;\n      });\n    }, delayMs);\n    return true;\n  }\n\n  async function handleRupertUpgradeTap() {\n    if (rupertInDining || !postGuestState.upgradeIntroSeen || dlgActive) return;\n    await refreshPostGuestResources();\n    setUpgradeMessage(null);\n    setShowUpgrades(true);\n  }\n\n  async function handleSecondPlotUpgrade() {\n    if (upgradeBusy || postGuestState.secondPlotUnlocked) return;\n    setUpgradeBusy(true);\n    setUpgradeMessage(null);\n    try {\n      const result = await purchaseSecondPlotUpgrade();\n      setPostGuestState(result.state);\n      setSharedResources(result.resources);\n      if (!result.ok) {\n        setUpgradeMessage(`Need ${SECOND_PLOT_WOOD_COST} Wood and ${SECOND_PLOT_STONE_COST} Stone.`);\n      } else if (result.alreadyUnlocked) {\n        setUpgradeMessage("Already unlocked.");\n      } else {\n        setUpgradeMessage("2nd Plot unlocked.");\n        audioManager.playSoundEffect("bling", { maxDurationMs: 2000 });\n      }\n    } finally {\n      setUpgradeBusy(false);\n    }\n  }\n\n  /** Start the Day-2 Kitchen prompt once the Kitchen is in a stable IDLE state. */\n  async function maybeStartTuesdayMorningTutorial'''
          rep(marker,insert,'post guest helpers')

          rep('''          const guestStep = await loadGuestTutorialIntroStep();\n          setRupertInDining(guestStep === "ready_for_water");''', '''          const guestStep = await loadGuestTutorialIntroStep();\n          setRupertInDining(guestTutorialKeepsRupertInDining(guestStep));''', 'focus Rupert fix')

          rep('''          // Tuesday morning prompt also runs on the initial Kitchen mount via the same helper.\n          if (await maybeStartTuesdayMorningTutorial(600)) return;''', '''          if (guestStep === "service_complete") {\n            if (await maybeStartPostGuestUpgradeIntro(250)) return;\n          }\n\n          // Tuesday morning prompt also runs on the initial Kitchen mount via the same helper.\n          if (await maybeStartTuesdayMorningTutorial(600)) return;''', 'focus upgrade intro')

          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add post guest upgrade behavior and fix Rupert focus state"
          git push origin HEAD:feat/post-guest-tutorial-upgrades
