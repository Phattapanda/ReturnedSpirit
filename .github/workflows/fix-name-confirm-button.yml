# Temporary trigger v2 for the centered player-name Confirm button fix.
name: Fix player-name Confirm button

on:
  push:
    branches:
      - fix/ui-bubble-portrait-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Center and compact the Confirm button
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("frontend/src/KitchenScreenBase.tsx")
          text = path.read_text()

          old_usage = 'style={[styles.continueBtn, !nameInputVal.trim() && styles.btnDisabled]}'
          new_usage = 'style={[styles.continueBtn, styles.confirmBtn, !nameInputVal.trim() && styles.btnDisabled]}'
          if old_usage not in text:
              raise SystemExit("Confirm button style usage not found")
          text = text.replace(old_usage, new_usage, 1)

          old_styles = '''  continueBtn: {
    flexDirection: "row", alignItems: "center", gap: 6,
    backgroundColor: "rgba(196,148,58,0.18)", borderRadius: 12,
    paddingVertical: 13, paddingHorizontal: 26,
    borderWidth: 1, borderColor: "rgba(196,148,58,0.35)", marginTop: 4,
  },
  continueTxt: { color: "#F5E6C8", fontSize: 15, fontFamily: "Oldenburg", letterSpacing: 0.6 },'''
          new_styles = '''  continueBtn: {
    flexDirection: "row", alignItems: "center", gap: 6,
    backgroundColor: "rgba(196,148,58,0.18)", borderRadius: 12,
    paddingVertical: 13, paddingHorizontal: 26,
    borderWidth: 1, borderColor: "rgba(196,148,58,0.35)", marginTop: 4,
  },
  confirmBtn: {
    alignSelf: "center",
    justifyContent: "center",
    minWidth: 150,
    paddingHorizontal: 24,
    marginTop: 12,
  },
  continueTxt: { color: "#F5E6C8", fontSize: 15, fontFamily: "Oldenburg", letterSpacing: 0.6 },'''
          if old_styles not in text:
              raise SystemExit("Continue button style block not found")
          text = text.replace(old_styles, new_styles, 1)

          path.write_text(text)
          PY

      - name: Validate
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint src/KitchenScreenBase.tsx
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-name-confirm-button.yml
          git add frontend/src/KitchenScreenBase.tsx
          git commit -m "Center and compact player-name Confirm button"
          git push origin HEAD:fix/ui-bubble-portrait-polish
