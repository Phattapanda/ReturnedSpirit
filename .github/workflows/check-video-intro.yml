name: Validate video intro

on:
  push:
    branches:
      - feat/video-intro

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-intro
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint intro screen
        working-directory: frontend
        run: npx eslint app/intro.tsx
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
