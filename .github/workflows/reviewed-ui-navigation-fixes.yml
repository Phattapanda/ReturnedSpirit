name: Apply reviewed UI and navigation fixes

on:
  push:
    branches:
      - fix/ui-bubble-portrait-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"missing {label}")

          # Guest Tutorial portraits: match normal story dialog dimensions.
          path = "frontend/src/components/GuestTutorialDialog.tsx"
          s = read(path)
          s = replace(s, "    paddingTop: 46,", "    paddingTop: 76,", "guest panel padding")
          s = replace(
              s,
              '    top: -46,\n    width: 92,\n    height: 92,\n    borderRadius: 46,\n    overflow: "hidden",\n    borderWidth: 2.5,',
              '    top: -62,\n    width: 124,\n    height: 124,\n    borderRadius: 62,\n    overflow: "hidden",\n    borderWidth: 3,',
              "guest portrait size",
          )
          s = replace(
              s,
              '    fontSize: 13,\n    letterSpacing: 0.8,\n    marginBottom: 6,',
              '    fontSize: 15,\n    letterSpacing: 1.2,\n    marginTop: 2,\n    marginBottom: 6,',
              "guest speaker size",
          )
          write(path, s)

          # Kitchen fixes.
          path = "frontend/src/KitchenScreenBase.tsx"
          s = read(path)

          s = replace(
              s,
              '    if (ts === "COOKING_SHARE_EAT" && item.id === "herbsoup") {\n      const isBeingDragged = soupDragging && soupSlot === slotIdx;',
              '    if (ts === "COOKING_SHARE_EAT" && item.id === "herbsoup") {\n      const isBeingDragged =\n        soupDragging && cookingDragActiveSlot < 0 && soupSlot === slotIdx;',
              "Herb Soup drag visibility",
          )
          s = replace(
              s,
              '    setSoupSlot(sourceSlot);\n    soupSlotRef.current = sourceSlot;\n    setFlyingItemId("herbsoup");',
              '    setSoupSlot(sourceSlot);\n    soupSlotRef.current = sourceSlot;\n    setCookingDragActiveSlot(-1);\n    setFlyingItemId("herbsoup");',
              "Herb Soup drag ownership",
          )

          if "const [coreTravelUnlocked, setCoreTravelUnlocked]" not in s:
              s = replace(
                  s,
                  '  const [diningUnlocked, setDiningUnlocked] = useState(false);',
                  '  const [diningUnlocked, setDiningUnlocked] = useState(false);\n  const [coreTravelUnlocked, setCoreTravelUnlocked] = useState(false);',
                  "Kitchen core travel state",
              )

          s = s.replace(
              'setDiningUnlocked(guestTutorialHasReached(step, "dining_prompt"));\n      setRupertInDining',
              'setDiningUnlocked(guestTutorialHasReached(step, "dining_prompt"));\n      setCoreTravelUnlocked(guestTutorialHasReached(step, "service_complete"));\n      setRupertInDining',
              1,
          )
          s = s.replace(
              'setDiningUnlocked(guestTutorialHasReached(initialGuestStep, "dining_prompt"));\n          setRupertInDining',
              'setDiningUnlocked(guestTutorialHasReached(initialGuestStep, "dining_prompt"));\n          setCoreTravelUnlocked(guestTutorialHasReached(initialGuestStep, "service_complete"));\n          setRupertInDining',
              1,
          )

          old_focus = '''          const cur = tsRef.current;
          if (cur !== "IDLE") return; // Don't interfere with active tutorial/dialog

          const guestStep = await loadGuestTutorialIntroStep();
          setDiningUnlocked(guestTutorialHasReached(guestStep, "dining_prompt"));
          setRupertInDining(guestTutorialKeepsRupertInDining(guestStep));'''
          new_focus = '''          const guestStep = await loadGuestTutorialIntroStep();
          setDiningUnlocked(guestTutorialHasReached(guestStep, "dining_prompt"));
          setCoreTravelUnlocked(guestTutorialHasReached(guestStep, "service_complete"));
          setRupertInDining(guestTutorialKeepsRupertInDining(guestStep));

          const cur = tsRef.current;
          if (cur !== "IDLE") return; // Navigation was refreshed; leave active gameplay state untouched.'''
          s = replace(s, old_focus, new_focus, "Kitchen focus refresh")

          s = re.sub(
              r'// ── TEMP DEV \(Point 5 – Dining Hall layout test\) ─+\n// Keep direct access for manual Expo layout testing; the story prompt below now\n// supplies the real tutorial unlock/pulse path\.\nconst DEV_DINING_TEST_ACCESS = false;\n\n',
              '',
              s,
              count=1,
          )

          s = replace(
              s,
              '''          if (enabledInGardenPrompt) {
            return (
              <Animated.View key={loc.id} style={[{ flex: 1 }, gardenPulseStyle]}>
                <TouchableOpacity
                  style={[styles.locBtn, styles.locBtnActive, styles.locBtnGardenHighlight, { flex: 1 }]}
                  onPress={handleGardenTap}
                  activeOpacity={0.8}
                >
                  {renderLocContent(true)}
                </TouchableOpacity>
              </Animated.View>
            );
          }

          if (enabledInDiningPrompt) {
            return (
              <Animated.View key={loc.id} style={[{ flex: 1 }, diningPulseStyle]}>
                <TouchableOpacity
                  style={[styles.locBtn, styles.locBtnActive, styles.locBtnGardenHighlight, { flex: 1 }]}
                  onPress={() => { void handleDiningTap(); }}
                  activeOpacity={0.8}
                >
                  {renderLocContent(true)}
                </TouchableOpacity>
              </Animated.View>
            );
          }''',
              '''          if (enabledInGardenPrompt) {
            return (
              <TouchableOpacity
                key={loc.id}
                style={[styles.locBtn, styles.locBtnActive, styles.locBtnGardenHighlight]}
                onPress={handleGardenTap}
                activeOpacity={0.8}
              >
                <Animated.View style={gardenPulseStyle}>{renderLocContent(true)}</Animated.View>
              </TouchableOpacity>
            );
          }

          if (enabledInDiningPrompt) {
            return (
              <TouchableOpacity
                key={loc.id}
                style={[styles.locBtn, styles.locBtnActive]}
                onPress={() => { void handleDiningTap(); }}
                activeOpacity={0.8}
              >
                <Animated.View style={diningPulseStyle}>{renderLocContent(true)}</Animated.View>
              </TouchableOpacity>
            );
          }''',
              "stable prompt buttons",
          )

          s = replace(
              s,
              '            enabledInDiningPrompt ||\n            (isGardenBtn && gardenActive) ||',
              '            enabledInDiningPrompt ||\n            (coreTravelUnlocked && (isGardenBtn || isDormBtn || isDiningBtn)) ||\n            (isGardenBtn && gardenActive) ||',
              "Kitchen core active buttons",
          )

          nav_start = s.index('          let locOnPress: (() => void) | undefined;')
          nav_end = s.index('          return (\n            <TouchableOpacity', nav_start)
          new_nav = '''          let locOnPress: (() => void) | undefined;
          if (isDiningBtn && diningUnlocked) {
            // Dining stays reachable throughout the guest tutorial, including
            // the return trip with Herb Soup.
            locOnPress = () => {
              audioManager.playSoundEffect('footstep', { maxDurationMs: 4000 });
              router.push("/dining");
            };
          } else if (!tutActive && isEffectivelyActive) {
            if (isGardenBtn && (gardenActive || coreTravelUnlocked)) {
              locOnPress = () => {
                audioManager.playSoundEffect('footstep', { maxDurationMs: 4000 });
                router.push("/garden");
              };
            } else if (isDormBtn && (dormitoryUnlocked || coreTravelUnlocked)) {
              locOnPress = rupertInDining
                ? () => showPlayerBubble('"I need to cook herb soup for the guest."')
                : () => {
                    audioManager.playSoundEffect('walking-on-wood', { maxDurationMs: 5000 });
                    router.push("/dormitory");
                  };
            }
          }

          const blockedByTutorial = tutActive && !(isDiningBtn && diningUnlocked);
'''
          s = s[:nav_start] + new_nav + s[nav_end:]
          s = s.replace(
              '              disabled={!isEffectivelyActive || tutActive}',
              '              disabled={!isEffectivelyActive || blockedByTutorial}',
              1,
          )

          s = replace(
              s,
              '        <View style={StyleSheet.absoluteFill} pointerEvents="box-only" />',
              '        <View\n          style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: locationBarH }}\n          pointerEvents="box-only"\n        />',
              "Kitchen blocker bounds",
          )

          s = replace(
              s,
              '''  closeBtn: {
    backgroundColor: "rgba(196,148,58,0.16)", borderRadius: 12,
    paddingVertical: 10, paddingHorizontal: 36,
    borderWidth: 1, borderColor: "rgba(196,148,58,0.35)", marginTop: 4,
  },''',
              '''  closeBtn: {
    alignSelf: "center",
    alignItems: "center",
    minWidth: 132,
    backgroundColor: "rgba(196,148,58,0.16)", borderRadius: 12,
    paddingVertical: 10, paddingHorizontal: 24,
    borderWidth: 1, borderColor: "rgba(196,148,58,0.35)", marginTop: 12,
  },''',
              "centered close button",
          )
          write(path, s)

          # Garden navigation progression.
          path = "frontend/src/GardenScreenBase.tsx"
          s = read(path)
          s = replace(
              s,
              'import { useLocalSearchParams, useRouter } from "expo-router";',
              'import { useFocusEffect, useLocalSearchParams, useRouter } from "expo-router";',
              "Garden focus import",
          )
          if "guestTutorialHasReached," not in s:
              s = replace(
                  s,
                  'import {\n  guestTutorialKeepsRupertInDining,',
                  'import {\n  guestTutorialHasReached,\n  guestTutorialKeepsRupertInDining,',
                  "Garden progression import",
              )
          if "const [diningUnlocked, setDiningUnlocked]" not in s:
              s = replace(
                  s,
                  '  const [secondPlotUnlocked, setSecondPlotUnlocked] = useState(false);',
                  '  const [secondPlotUnlocked, setSecondPlotUnlocked] = useState(false);\n  const [diningUnlocked, setDiningUnlocked] = useState(false);\n  const [coreTravelUnlocked, setCoreTravelUnlocked] = useState(false);',
                  "Garden travel state",
              )
          if "Guest progression refresh" not in s:
              marker = '  // ── Tutorial state machine\n'
              focus = '''  // Guest progression refresh: Dining opens at dining_prompt;
  // Dormitory becomes normal travel after service_complete.
  useFocusEffect(
    React.useCallback(() => {
      let active = true;
      loadGuestTutorialIntroStep()
        .then((step) => {
          if (!active) return;
          setDiningUnlocked(guestTutorialHasReached(step, "dining_prompt"));
          setCoreTravelUnlocked(guestTutorialHasReached(step, "service_complete"));
          setRupertInDining(guestTutorialKeepsRupertInDining(step));
          setRupertAwayFromGarden(guestTutorialRupertHasLeftGarden(step));
        })
        .catch(() => {});
      return () => { active = false; };
    }, []),
  );

'''
              s = replace(s, marker, focus + marker, "Garden focus refresh")

          start = s.index('        {/* Locked slots: dining, dormitory, mail, explore */}')
          end = s.index('      </View>\n\n      {/* ── Loading overlay', start)
          nav = '''        {/* Guest progression unlocks Dining first, then all core travel. */}
        {([
          { id: "dining",    img: IMG.loc_dining    },
          { id: "dormitory", img: IMG.loc_dormitory },
          { id: "mail",      img: IMG.loc_mail      },
          { id: "explore",   img: IMG.loc_explore   },
        ] as const).map((loc) => {
          const guestDormitoryBlocked = rupertInDining && loc.id === "dormitory";
          const diningAvailable = diningUnlocked && loc.id === "dining";
          const dormitoryAvailable = coreTravelUnlocked && loc.id === "dormitory";
          const active = guestDormitoryBlocked || diningAvailable || dormitoryAvailable;
          const onPress = guestDormitoryBlocked
            ? () => showPlayerBubble('"I need to cook herb soup for the guest."')
            : diningAvailable
              ? () => {
                  audioManager.playSoundEffect("footstep", { maxDurationMs: 4000 });
                  router.push("/dining");
                }
              : dormitoryAvailable
                ? () => {
                    audioManager.playSoundEffect("walking-on-wood", { maxDurationMs: 5000 });
                    router.push("/dormitory");
                  }
                : undefined;
          return (
            <TouchableOpacity
              key={loc.id}
              style={[styles.locBtn, active ? styles.locBtnActive : styles.locBtnLocked]}
              disabled={!active}
              onPress={onPress}
              activeOpacity={0.8}
            >
              <Image
                source={loc.img}
                style={[styles.locBtnImg, !active && styles.locBtnImgLocked]}
                resizeMode="contain"
                resizeMethod="resize"
              />
            </TouchableOpacity>
          );
        })}
'''
          s = s[:start] + nav + s[end:]
          write(path, s)

          # Dining navigation: explicit routes, no history-dependent back action.
          path = "frontend/app/dining.tsx"
          s = read(path)
          s = replace(
              s,
              'import { useLocalSearchParams, useRouter } from "expo-router";',
              'import { useRouter } from "expo-router";',
              "Dining router import",
          )
          s = replace(
              s,
              '  const router = useRouter();\n  const params = useLocalSearchParams<{ loadedFromSave?: string }>();',
              '  const router = useRouter();',
              "Dining params removal",
          )
          s = replace(
              s,
              '''  function goToKitchen() {
    audioManager.playSoundEffect("footstep", { maxDurationMs: 4000 });
    if (router.canGoBack() && params.loadedFromSave !== "1") router.back();
    else router.replace("/kitchen");
  }''',
              '''  function goToKitchen() {
    audioManager.playSoundEffect("footstep", { maxDurationMs: 4000 });
    router.replace("/kitchen");
  }''',
              "Dining Kitchen route",
          )
          nav_start = s.index('          const isCurrent = loc.id === "dining";')
          nav_end = s.index('          return (\n            <TouchableOpacity', nav_start)
          nav_logic = '''          const isCurrent = loc.id === "dining";
          const coreTravelUnlocked = guestTutorialHasReached(tutorialStep, "service_complete");
          const guestDormitoryBlocked = guestTutorialKeepsRupertInDining(tutorialStep) && loc.id === "dormitory";
          const coreDestination = coreTravelUnlocked &&
            (loc.id === "kitchen" || loc.id === "garden" || loc.id === "dormitory");
          const locImg = IMG[`loc_${loc.id}` as keyof typeof IMG] as number | undefined;
          const active = loc.id === "kitchen" || isCurrent || coreDestination || guestDormitoryBlocked;

          const content = locImg ? (
            <Image
              source={locImg}
              style={[styles.locBtnImg, !active && styles.locBtnImgLocked]}
              resizeMode="contain"
              resizeMethod="resize"
            />
          ) : (
            <Ionicons name="help-outline" size={22} color={active ? "#F5E6C8" : "#3A3535"} />
          );

          const locationAction = guestDormitoryBlocked
            ? () => showPlayerThought("I need to cook herb soup for the guest.")
            : loc.id === "kitchen"
              ? goToKitchen
              : loc.id === "garden" && coreDestination
                ? () => {
                    audioManager.playSoundEffect("footstep", { maxDurationMs: 4000 });
                    router.replace("/garden");
                  }
                : loc.id === "dormitory" && coreDestination
                  ? () => {
                      audioManager.playSoundEffect("walking-on-wood", { maxDurationMs: 5000 });
                      router.replace("/dormitory");
                    }
                  : undefined;

'''
          s = s[:nav_start] + nav_logic + s[nav_end:]
          write(path, s)

          # Strong sentinels: fail before validation if a requested fix did not land.
          checks = {
              "frontend/src/components/GuestTutorialDialog.tsx": ["width: 124", "top: -62"],
              "frontend/src/KitchenScreenBase.tsx": [
                  "cookingDragActiveSlot < 0",
                  "blockedByTutorial",
                  "coreTravelUnlocked",
                  "alignSelf: \"center\"",
              ],
              "frontend/src/GardenScreenBase.tsx": ["diningUnlocked", "coreTravelUnlocked", "useFocusEffect"],
              "frontend/app/dining.tsx": ["router.replace(\"/kitchen\")", "coreDestination"],
              "frontend/app/intro.tsx": ['fontFamily: "Oldenburg"'],
          }
          for file, needles in checks.items():
              text = read(file)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"missing sentinel {needle!r} in {file}")
          PY

      - name: Validate TypeScript and focused lint
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint \
            src/KitchenScreenBase.tsx \
            src/GardenScreenBase.tsx \
            src/components/GuestTutorialDialog.tsx \
            app/dining.tsx \
            app/intro.tsx
          git diff --check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reviewed-ui-navigation-fixes.yml
          git add frontend
          git commit -m "Fix reviewed tutorial UI drag and navigation issues"
          git push origin HEAD:fix/ui-bubble-portrait-polish
