name: Apply screenshot-based UI typography fixes

on:
  push:
    branches:
      - fix/ui-bubble-portrait-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Apply screenshot-based UI fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_first(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{path}: missing pattern {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Main menu / save-slot typography.
          # Oldenburg is a single registered 400 face. fontWeight=700 causes Android
          # to fall back to a system sans face, so do not combine it with fake bold.
          for path in ["frontend/app/new-game.tsx", "frontend/app/load-game.tsx"]:
              p = Path(path)
              text = p.read_text()
              text = text.replace('fontWeight: "700",\n    color: "#2C1810",\n    fontFamily: "Oldenburg",', 'color: "#2C1810",\n    fontFamily: "Oldenburg",')
              text = text.replace('fontSize: 17, fontWeight: "700", color: "#2C1810", fontFamily: "Oldenburg"', 'fontSize: 17, color: "#2C1810", fontFamily: "Oldenburg"')
              if path.endswith("new-game.tsx"):
                  text = text.replace('sheetTitle: { fontSize: 20, fontWeight: "700", color: "#2C1810", fontFamily: "Oldenburg", textAlign: "center" }', 'sheetTitle: { fontSize: 20, color: "#2C1810", fontFamily: "Oldenburg", textAlign: "center" }')
                  text = text.replace('beginBtnText: { color: "#FFF", fontSize: 16, fontWeight: "700", fontFamily: "Oldenburg" }', 'beginBtnText: { color: "#FFF", fontSize: 16, fontFamily: "Oldenburg" }')
              p.write_text(text)

          # Intro dialog: all dialog-window text is spoken text -> Roboto Regular.
          # Continue remains Oldenburg. Keep Rupert portrait crop unchanged (already correct).
          replace_once(
              "frontend/app/intro.tsx",
              '  dialogText: {\n    color: "#F0E8D5",\n    fontSize: 16,\n    lineHeight: 25,\n    fontStyle: "italic",\n    textAlign: "center",\n  },',
              '  dialogText: {\n    color: "#F0E8D5",\n    fontSize: 16,\n    lineHeight: 25,\n    fontFamily: "RobotoRegular",\n    textAlign: "center",\n  },',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '  continueTxt: {\n    color: "#F5E6C8",\n    fontSize: 15,\n    fontWeight: "700",\n  },',
              '  continueTxt: {\n    color: "#F5E6C8",\n    fontSize: 15,\n    fontFamily: "Oldenburg",\n  },',
          )

          # Kitchen Day-1 dialog: spoken text Regular; Rupert dialog portrait gets same 1.06 crop.
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              'style={[styles.dlgPortrait, curLine?.portrait === "player" && styles.playerPortraitImage]}',
              'style={[styles.dlgPortrait, curLine?.portrait === "player" ? styles.playerPortraitImage : styles.npcPortraitImage]}',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '  dlgText: { color: "#F0E8D5", fontSize: 16, lineHeight: 25, fontStyle: "italic", textAlign: "center" },',
              '  dlgText: { color: "#F0E8D5", fontSize: 16, lineHeight: 25, fontFamily: "RobotoRegular", textAlign: "center" },',
          )

          # Guest tutorial dialog window follows the same spoken-text rule.
          replace_once(
              "frontend/src/components/GuestTutorialDialog.tsx",
              '  dialogText: {\n    color: "#F0E8D5",\n    fontFamily: "Oldenburg",\n    fontSize: 14,',
              '  dialogText: {\n    color: "#F0E8D5",\n    fontFamily: "RobotoRegular",\n    fontSize: 14,',
          )

          # Player bubbles are always thoughts outside dialog windows:
          # Roboto Italic + no surrounding quotation marks.
          thought_targets = [
              ("frontend/src/KitchenScreenBase.tsx", "setPlayerBubble(text);", "setPlayerBubble"),
              ("frontend/src/GardenScreenBase.tsx", "setPlayerBubble(text);", "setPlayerBubble"),
              ("frontend/app/dormitory.tsx", "setPlayerBubble(text);", "setPlayerBubble"),
              ("frontend/app/dining.tsx", "setPlayerThought(text);", "setPlayerThought"),
          ]
          for path, marker, setter in thought_targets:
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  cleaned = 'const thought = text.trim().replace(/^["“”]+|["“”]+$/g, "");\n    ' + setter + '(thought);'
                  text = text.replace(marker, cleaned, 1)
              p.write_text(text)

          # Enforce the intended font faces for every known bubble style.
          style_replacements = {
              "frontend/src/KitchenScreenBase.tsx": [
                  ('fontFamily: "RobotoRegular",\n  },\n  // Player thought bubble', 'fontFamily: "RobotoRegular",\n  },\n  // Player thought bubble'),
                  ('fontFamily: "RobotoItalic",\n    lineHeight: 18,', 'fontFamily: "RobotoItalic",\n    lineHeight: 18,'),
              ],
              "frontend/src/GardenScreenBase.tsx": [
                  ('bubbleText: { color: "#2A1000", fontSize: 15, lineHeight: 22, fontFamily: "RobotoRegular" }', 'bubbleText: { color: "#2A1000", fontSize: 15, lineHeight: 22, fontFamily: "RobotoRegular" }'),
                  ('playerBubbleText: { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 }', 'playerBubbleText: { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 }'),
              ],
              "frontend/app/dormitory.tsx": [
                  ('playerBubbleText:  { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 }', 'playerBubbleText:  { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 }'),
              ],
              "frontend/app/dining.tsx": [
                  ('fontFamily: "RobotoItalic",', 'fontFamily: "RobotoItalic",'),
              ],
          }
          for path, pairs in style_replacements.items():
              text = Path(path).read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"{path}: expected bubble style missing: {old!r}")
                  text = text.replace(old, new, 1)
              Path(path).write_text(text)

          # Garden Storage title: replace the old placeholder bag icon with the actual
          # Garden Storage navigation image already used in the location bar.
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '<Ionicons name="bag-outline" size={20} color="#C4943A" />\n              <Text style={styles.panelTitle}> Garden Storage</Text>',
              '<Image source={IMG.loc_storage} style={{ width: 28, height: 28 }} resizeMode="contain" resizeMethod="resize" />\n              <Text style={styles.panelTitle}>Garden Storage</Text>',
          )
          PY

      - name: Validate
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint app/new-game.tsx app/load-game.tsx app/intro.tsx app/dining.tsx app/dormitory.tsx src/KitchenScreenBase.tsx src/GardenScreenBase.tsx src/components/GuestTutorialDialog.tsx
          git diff --check

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-polish-followup.yml
          git add frontend
          git commit -m "Fix screenshot-based bubble and UI typography"
          git push origin HEAD:fix/ui-bubble-portrait-polish
