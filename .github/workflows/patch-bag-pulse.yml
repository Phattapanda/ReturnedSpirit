name: Stop Garden bag pulse after first inspection

on:
  push:
    branches:
      - feat/guest-tutorial-serving

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guest-tutorial-serving
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/app/garden.tsx')
          s = p.read_text()
          old = '''        // Load player bag\n        const rawBag = await AsyncStorage.getItem(PLAYER_BAG_KEY);\n        if (rawBag) { try { setPlayerBag(JSON.parse(rawBag)); } catch { /* default */ } }\n\n        // Load day\n'''
          new = '''        // Load player bag\n        const rawBag = await AsyncStorage.getItem(PLAYER_BAG_KEY);\n        if (rawBag) { try { setPlayerBag(JSON.parse(rawBag)); } catch { /* default */ } }\n\n        // Bag pulse is a one-time tutorial cue. Once the bag was inspected after\n        // receiving it, every later Garden visit must restore that persisted state.\n        const inspectedBag = await AsyncStorage.getItem(BAG_INSPECTED_KEY);\n        setBagInspected(inspectedBag === "true");\n\n        // Load day\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected 1 match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/garden.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stop Garden bag pulse after first inspection"
          git push origin HEAD:feat/guest-tutorial-serving
