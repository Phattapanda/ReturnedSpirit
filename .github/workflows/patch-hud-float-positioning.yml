name: Patch HUD float positioning

on:
  push:
    branches:
      - fix/hud-float-positioning
    paths:
      - .github/workflows/patch-hud-float-positioning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hud-float-positioning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Align HUD floating numbers to bar ends
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Assert consistent anchors
        run: |
          grep -q 'statBarTrackWrap' frontend/app/kitchen.tsx
          grep -q 'position: "absolute", right: -8, top: 12' frontend/app/kitchen.tsx
          grep -q 'statBarTrackWrap' frontend/app/garden.tsx
          grep -q 'position: "absolute", right: -8, top: 12' frontend/app/garden.tsx
          grep -q 'regenFloat:   { position: "absolute", right: -8, top: 12' frontend/app/dormitory.tsx
          ! grep -q 'right: W \* 0.32' frontend/app/dormitory.tsx

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate changed screens
        working-directory: frontend
        run: |
          npx eslint app/kitchen.tsx app/garden.tsx app/dormitory.tsx
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx frontend/app/garden.tsx frontend/app/dormitory.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Align HUD floating numbers to stat bars"
          git push origin HEAD:fix/hud-float-positioning
