name: Validate consolidated checkpoint

on:
  push:
    branches:
      - chore/consolidate-tested-gameplay-fixes
    paths:
      - .github/workflows/validate-consolidated-checkpoint.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/consolidate-tested-gameplay-fixes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate consolidated gameplay files
        working-directory: frontend
        run: |
          npx eslint app/intro.tsx app/game-loading.tsx app/kitchen.tsx app/garden.tsx app/dormitory.tsx src/game/save-manager.ts
          npx tsc --noEmit
