name: Run reviewed fixes on synchronize

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/ui-bubble-portrait-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Extract and run v2 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          raw = Path('.github/workflows/run-reviewed-fixes-v2.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          block = raw[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )

          exact_prompt_replacement = "s = one(s, prompt_old, prompt_new, 'Stable prompt button frames')"
          robust_prompt_replacement = '''prompt_start = s.index('          if (enabledInGardenPrompt) {')
prompt_end = s.index('          // In Tuesday kitchen state', prompt_start)
s = s[:prompt_start] + prompt_new + "\\n\\n" + s[prompt_end:]'''
          if exact_prompt_replacement not in script:
              raise SystemExit('v2 patch prompt replacement hook missing')
          script = script.replace(exact_prompt_replacement, robust_prompt_replacement, 1)

          Path('/tmp/apply-reviewed-fixes-v2.py').write_text(script)
          PY
          python3 /tmp/apply-reviewed-fixes-v2.py

      - name: Validate TypeScript and focused lint
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint \
            src/KitchenScreenBase.tsx \
            src/GardenScreenBase.tsx \
            src/components/GuestTutorialDialog.tsx \
            app/dining.tsx \
            app/intro.tsx
          git diff --check

      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/reviewed-ui-navigation-fixes.yml \
            .github/workflows/run-reviewed-fixes-on-pr.yml \
            .github/workflows/run-reviewed-fixes-v2.yml \
            .github/workflows/run-reviewed-fixes-sync.yml \
            .github/reviewed-fixes-trigger.txt
          git add frontend
          git commit -m "Fix reviewed tutorial UI drag and navigation issues"
          git push origin HEAD:fix/ui-bubble-portrait-polish
