name: Finalize video intro

on:
  push:
    branches:
      - feat/video-intro

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-intro
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Switch intro to bundled MP4
        run: node -e "const fs=require('fs');const p='frontend/app/intro.tsx';let s=fs.readFileSync(p,'utf8');const start=s.indexOf('// The MP4 will live in frontend/assets/video/intro.mp4.');const end=s.indexOf('};',start);if(start<0||end<0)process.exit(2);s=s.slice(0,start)+'// Bundled portrait cinematic used for new-game intro playback.\nconst INTRO_VIDEO = require(\"../assets/intro.mp4\");'+s.slice(end+2);fs.writeFileSync(p,s);"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate intro
        working-directory: frontend
        run: |
          npx eslint app/intro.tsx
          npx tsc --noEmit
      - name: Commit final intro source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/intro.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use bundled intro video asset"
          git push
