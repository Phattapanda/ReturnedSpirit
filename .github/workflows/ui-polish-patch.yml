name: Apply UI bubble and portrait polish

on:
  push:
    branches:
      - fix/ui-bubble-portrait-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-bubble-portrait-polish
          fetch-depth: 0

      - name: Apply focused UI polish
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Fonts: keep Oldenburg for story/UI typography, add dedicated bubble faces.
          replace_once(
              "frontend/src/hooks/use-app-fonts.ts",
              'const OLDENBURG_CDN =\n  "https://cdn.jsdelivr.net/fontsource/fonts/oldenburg@latest/latin-400-normal.ttf";\n',
              'const OLDENBURG_CDN =\n  "https://cdn.jsdelivr.net/fontsource/fonts/oldenburg@latest/latin-400-normal.ttf";\nconst ROBOTO_REGULAR_CDN =\n  "https://cdn.jsdelivr.net/fontsource/fonts/roboto@latest/latin-400-normal.ttf";\nconst ROBOTO_ITALIC_CDN =\n  "https://cdn.jsdelivr.net/fontsource/fonts/roboto@latest/latin-400-italic.ttf";\n',
          )
          replace_once(
              "frontend/src/hooks/use-app-fonts.ts",
              'const FONT_MAP_CDN = { Oldenburg: OLDENBURG_CDN } as const;\nconst FONT_MAP_LOCAL = {\n  Oldenburg: require("../../assets/fonts/Oldenburg-Regular.ttf") as number,\n} as const;',
              'const FONT_MAP_CDN = {\n  Oldenburg: OLDENBURG_CDN,\n  RobotoRegular: ROBOTO_REGULAR_CDN,\n  RobotoItalic: ROBOTO_ITALIC_CDN,\n} as const;\nconst FONT_MAP_LOCAL = {\n  Oldenburg: require("../../assets/fonts/Oldenburg-Regular.ttf") as number,\n  RobotoRegular: require("../../assets/fonts/Roboto-Regular.ttf") as number,\n  RobotoItalic: require("../../assets/fonts/Roboto-Italic.ttf") as number,\n} as const;',
          )

          # Intro speech bubble: intrinsic content width, Roboto Regular, NPC overscan.
          replace_once(
              "frontend/app/intro.tsx",
              '            styles.bubble,\n            { bottom: insets.bottom + 68, opacity: bubbleOpacity },',
              '            styles.bubbleWrap,\n            { bottom: insets.bottom + 68, opacity: bubbleOpacity },',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '        >\n          <Text style={styles.bubbleText}>{\'"Are you awake?"\'}</Text>\n          <View style={styles.bubbleTail} />\n        </Animated.View>',
              '        >\n          <View style={styles.bubble}>\n            <Text style={styles.bubbleText}>{\'"Are you awake?"\'}</Text>\n            <View style={styles.bubbleTail} />\n          </View>\n        </Animated.View>',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '  bubble: {\n    position: "absolute",\n    left: 24,\n    right: 24,\n    backgroundColor:',
              '  bubbleWrap: {\n    position: "absolute",\n    left: 24,\n    right: 24,\n    alignItems: "center",\n  },\n  bubble: {\n    maxWidth: "82%",\n    backgroundColor:',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '    fontStyle: "italic",\n    fontFamily: "Oldenburg",',
              '    fontFamily: "RobotoRegular",',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '              style={[styles.portrait, dialogPortrait === "player_tired" && styles.playerPortraitImage]}',
              '              style={[styles.portrait, dialogPortrait === "player_tired" ? styles.playerPortraitImage : styles.npcPortraitImage]}',
          )
          replace_once(
              "frontend/app/intro.tsx",
              '  playerPortraitImage: { transform: [{ scale: 1.06 }] },',
              '  playerPortraitImage: { transform: [{ scale: 1.06 }] },\n  npcPortraitImage: { transform: [{ scale: 1.06 }] },',
          )

          # Kitchen: dynamic speech width, Roboto bubble faces, compact item info, Rupert overscan.
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '        // Width: ~68% of screen, right-biased so it doesn\'t overlap left table slots\n        const bubbleWidthTarget = W * 0.68;',
              '        // Size to the current content, then cap it for comfortable mobile wrapping.\n        const bubbleWidthTarget = Math.min(\n          W * 0.78,\n          Math.max(180, Math.min(420, Math.max(bubble.text.length * 7.2, bubble.speaker.length * 9) + 48)),\n        );',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '  bubbleText: {\n    color: "#2A1000",\n    fontSize: 15,\n    lineHeight: 22,\n    fontStyle: "italic",\n  },',
              '  bubbleText: {\n    color: "#2A1000",\n    fontSize: 15,\n    lineHeight: 22,\n    fontFamily: "RobotoRegular",\n  },',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '  playerBubbleText: {\n    color: "#2A1000",\n    fontSize: 13,\n    fontStyle: "italic",\n    lineHeight: 18,\n  },',
              '  playerBubbleText: {\n    color: "#2A1000",\n    fontSize: 13,\n    fontFamily: "RobotoItalic",\n    lineHeight: 18,\n  },',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '    paddingVertical: 10,\n    paddingHorizontal: 28,\n    borderWidth: 1.5,',
              '    paddingVertical: 9,\n    paddingHorizontal: 14,\n    maxWidth: "78%",\n    borderWidth: 1.5,',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '<Image source={rupertSrc(rupertPortrait)} style={styles.circleImg} resizeMode="cover" resizeMethod="resize" />',
              '<Image source={rupertSrc(rupertPortrait)} style={[styles.circleImg, styles.npcPortraitImage]} resizeMode="cover" resizeMethod="resize" />',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },',
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },\n  npcPortraitImage: { transform: [{ scale: 1.06 }] },',
          )
          replace_once(
              "frontend/src/KitchenScreenBase.tsx",
              'const DEV_DINING_TEST_ACCESS = true;',
              'const DEV_DINING_TEST_ACCESS = false;',
          )

          # Garden: content-sized speech bubbles, Roboto faces, Rupert overscan.
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '    const arrowCenterX = rupertL ? rupertL.x + rupertL.w / 2 : W / 2;\n    const bubbleLeftCalc = 16;\n    const bubbleRightCalc = 16;',
              '    const arrowCenterX = rupertL ? rupertL.x + rupertL.w / 2 : W / 2;\n    const bubbleWidthTarget = Math.min(\n      W - 32,\n      Math.max(180, Math.min(W * 0.78, Math.max(bubble.text.length * 7.2, bubble.speaker.length * 9) + 48)),\n    );\n    const bubbleLeftCalc = Math.max(16, Math.min(arrowCenterX - bubbleWidthTarget / 2, W - bubbleWidthTarget - 16));\n    const bubbleRightCalc = Math.max(16, W - bubbleLeftCalc - bubbleWidthTarget);',
          )
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '  bubbleText: { color: "#2A1000", fontSize: 15, lineHeight: 22, fontStyle: "italic" },',
              '  bubbleText: { color: "#2A1000", fontSize: 15, lineHeight: 22, fontFamily: "RobotoRegular" },',
          )
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '  playerBubbleText: { color: "#2A1000", fontSize: 13, fontStyle: "italic", fontFamily: "Oldenburg", lineHeight: 20 },',
              '  playerBubbleText: { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 },',
          )
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '<Image source={rupertSrc(rupertPortrait)} style={styles.circleImg} resizeMode="cover" resizeMethod="resize" />',
              '<Image source={rupertSrc(rupertPortrait)} style={[styles.circleImg, styles.npcPortraitImage]} resizeMode="cover" resizeMethod="resize" />',
          )
          replace_once(
              "frontend/src/GardenScreenBase.tsx",
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },',
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },\n  npcPortraitImage: { transform: [{ scale: 1.06 }] },',
          )

          # Dining thought bubble: content-sized and Roboto Italic. Rupert overscan too.
          replace_once(
              "frontend/app/dining.tsx",
              '<View style={styles.playerThoughtWrap} pointerEvents="none">',
              '<View\n              style={[styles.playerThoughtWrap, { width: Math.min(W * 0.72, Math.max(150, playerThought.length * 6.6 + 32)) }]}\n              pointerEvents="none"\n            >',
          )
          replace_once(
              "frontend/app/dining.tsx",
              '    width: 184,\n    zIndex: 30,',
              '    maxWidth: 280,\n    zIndex: 30,',
          )
          replace_once(
              "frontend/app/dining.tsx",
              '    fontStyle: "italic",\n    fontFamily: "Oldenburg",',
              '    fontFamily: "RobotoItalic",',
          )
          replace_once(
              "frontend/app/dining.tsx",
              '<Image source={IMG.rupert} style={styles.circleImg} resizeMode="cover" resizeMethod="resize" />',
              '<Image source={IMG.rupert} style={[styles.circleImg, styles.npcPortraitImage]} resizeMode="cover" resizeMethod="resize" />',
          )
          replace_once(
              "frontend/app/dining.tsx",
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },',
              '  circleImg: { width: "100%", height: "100%" },\n  playerPortraitImage: { transform: [{ scale: 1.06 }] },\n  npcPortraitImage: { transform: [{ scale: 1.06 }] },',
          )

          # Dormitory thought bubble: intrinsic-ish width based on its current text and Roboto Italic.
          replace_once(
              "frontend/app/dormitory.tsx",
              '<View style={{ position: "absolute", top: topPos, left: W * 0.18, right: Math.max(8, W - W * 0.18 - Math.min(W * 0.75, 420)) }} pointerEvents="none">',
              '<View\n          style={{\n            position: "absolute",\n            top: topPos,\n            left: W * 0.18,\n            width: Math.min(W * 0.75, Math.max(150, playerBubble.length * 6.6 + 32)),\n          }}\n          pointerEvents="none"\n        >',
          )
          replace_once(
              "frontend/app/dormitory.tsx",
              '  playerBubbleText:  { color: "#2A1000", fontSize: 13, fontStyle: "italic", fontFamily: "Oldenburg", lineHeight: 20 },',
              '  playerBubbleText:  { color: "#2A1000", fontSize: 13, fontFamily: "RobotoItalic", lineHeight: 20 },',
          )

          # Guest tutorial portraits: preserve player crop and apply the same 1.06 overscan to NPCs.
          replace_once(
              "frontend/src/components/GuestTutorialDialog.tsx",
              '            style={[styles.portrait, line.playerPortrait && styles.playerPortrait]}',
              '            style={[styles.portrait, line.playerPortrait ? styles.playerPortrait : styles.npcPortrait]}',
          )
          replace_once(
              "frontend/src/components/GuestTutorialDialog.tsx",
              '  playerPortrait: { transform: [{ scale: 1.06 }] },',
              '  playerPortrait: { transform: [{ scale: 1.06 }] },\n  npcPortrait: { transform: [{ scale: 1.06 }] },',
          )

          # Guest cards: Old Farmer, Coachman and future guest portraits use the same overscan.
          replace_once(
              "frontend/src/components/GuestCard.tsx",
              '  portraitImage: {\n    width: "100%",\n    height: "100%",\n  },',
              '  portraitImage: {\n    width: "100%",\n    height: "100%",\n    transform: [{ scale: 1.06 }],\n  },',
          )
          PY

      - name: Validate TypeScript and focused lint
        shell: bash
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npx eslint \
            app/intro.tsx \
            app/dining.tsx \
            app/dormitory.tsx \
            src/KitchenScreenBase.tsx \
            src/GardenScreenBase.tsx \
            src/components/GuestTutorialDialog.tsx \
            src/components/GuestCard.tsx \
            src/hooks/use-app-fonts.ts
          git diff --check

      - name: Commit the patch and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ui-polish-patch.yml
          git add frontend
          git commit -m "Polish bubbles fonts portraits and locked dining UI"
          git push origin HEAD:fix/ui-bubble-portrait-polish
