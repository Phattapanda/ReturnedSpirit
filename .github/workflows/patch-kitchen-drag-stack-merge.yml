name: Patch Kitchen drag stack merge

on:
  push:
    branches:
      - fix/kitchen-drag-stack-merge
    paths:
      - .github/workflows/patch-kitchen-drag-stack-merge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kitchen-drag-stack-merge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch Kitchen table drag stacking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/app/kitchen.tsx')
          text = path.read_text()
          old_import = 'import {\n  PLAYER_BAG_KEY, DEFAULT_BAG, KITCHEN_TABLE_KEY, ITEM_CATALOG,\n  type PlayerBagData, type BagItem,\n} from "@/src/game/item-system";'
          new_import = 'import {\n  PLAYER_BAG_KEY, DEFAULT_BAG, KITCHEN_TABLE_KEY, ITEM_CATALOG,\n  canStack, getContainerStackLimit,\n  type PlayerBagData, type BagItem,\n} from "@/src/game/item-system";'
          if text.count(old_import) != 1:
              raise SystemExit(f'Expected one item-system import block, found {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old_block = '    if (srcSlot <= 11) newTable[srcSlot] = destItem;\n    else if (srcSlot <= 14) newIng[srcSlot - 12] = destItem;\n    else if (srcSlot === 15) newTool = destItem;\n\n    if (destSlot <= 11) newTable[destSlot] = srcItem;\n    else if (destSlot <= 14) newIng[destSlot - 12] = srcItem;\n    else if (destSlot === 15) newTool = srcItem;\n'
          new_block = '    const setItemAtSlot = (slot: number, item: BagItem | null) => {\n      if (slot <= 11) newTable[slot] = item;\n      else if (slot <= 14) newIng[slot - 12] = item;\n      else if (slot === 15) newTool = item;\n    };\n\n    // Kitchen Table stacks merge when the dragged item is dropped onto a\n    // compatible table stack. Recipe Ingredient/Tool slots intentionally keep\n    // their existing swap behavior so crafting semantics do not change here.\n    const canMergeOnTable =\n      srcSlot <= 11 &&\n      destSlot <= 11 &&\n      destItem !== null &&\n      canStack(srcItem, destItem);\n\n    if (canMergeOnTable) {\n      const maxStack = getContainerStackLimit("kitchenTable");\n      const capacity = Math.max(0, maxStack - destItem.quantity);\n      if (capacity <= 0) return;\n\n      const movedQty = Math.min(srcItem.quantity, capacity);\n      const remainingQty = srcItem.quantity - movedQty;\n\n      setItemAtSlot(destSlot, { ...destItem, quantity: destItem.quantity + movedQty });\n      setItemAtSlot(srcSlot, remainingQty > 0 ? { ...srcItem, quantity: remainingQty } : null);\n    } else {\n      // Non-compatible items keep the established drag-and-drop swap behavior.\n      setItemAtSlot(srcSlot, destItem);\n      setItemAtSlot(destSlot, srcItem);\n    }\n'
          if text.count(old_block) != 1:
              raise SystemExit(f'Expected one Kitchen swap block, found {text.count(old_block)}')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
          PY

      - name: Assert scoped stack behavior
        run: |
          grep -q 'canStack, getContainerStackLimit' frontend/app/kitchen.tsx
          grep -q 'getContainerStackLimit("kitchenTable")' frontend/app/kitchen.tsx
          grep -q 'const canMergeOnTable' frontend/app/kitchen.tsx

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate Kitchen
        working-directory: frontend
        run: |
          npx eslint app/kitchen.tsx
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Merge compatible Kitchen table stacks on drag"
          git push origin HEAD:fix/kitchen-drag-stack-merge
