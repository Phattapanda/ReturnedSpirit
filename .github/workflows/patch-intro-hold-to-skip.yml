name: Patch intro hold to skip

on:
  push:
    branches:
      - fix/intro-hold-to-skip
    paths:
      - .github/workflows/patch-intro-hold-to-skip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intro-hold-to-skip
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch intro hold gesture
        run: |
          echo '' | base64 -d > /tmp/patch_intro.py
          python3 /tmp/patch_intro.py

      - name: Assert skip behavior
        run: |
          grep -q 'testID="intro-hold-to-skip"' frontend/app/intro.tsx
          grep -q 'skipTimerRef.current = setTimeout' frontend/app/intro.tsx
          grep -q 'pointerEvents="none" style={StyleSheet.absoluteFill}' frontend/app/intro.tsx
          ! grep -q 'onLongPress={handleSkipLongPress}' frontend/app/intro.tsx

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate intro
        working-directory: frontend
        run: |
          npx eslint app/intro.tsx
          npx tsc --noEmit

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/intro.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Restore hold to skip for intro video"
          git push origin HEAD:fix/intro-hold-to-skip
