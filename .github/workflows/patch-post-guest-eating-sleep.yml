name: Apply post-guest eating and sleep fixes

on:
  push:
    branches:
      - fix/post-guest-eating-sleep

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-guest-eating-sleep
          fetch-depth: 0

      - name: Apply exact gameplay fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kitchen = Path('frontend/src/KitchenScreenBase.tsx')
          dormitory = Path('frontend/app/dormitory.tsx')
          k = kitchen.read_text()
          d = dormitory.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Normal Herb Soup consumption after the tutorial.
          marker = '''  /** Drop a generic Kitchen item. Source is supplied by the item's own GestureDetector. */\n  function handleCookingItemDrop(srcSlot: number, absX: number, absY: number) {'''
          helper = '''  /** Consume exactly one Herb Soup serving during normal post-tutorial play. */\n  async function consumeHerbSoupNormally(srcSlot: number, absX: number, absY: number) {\n    if (inputLocked.current) return;\n    const item = getCookingItemAtSlot(srcSlot);\n    if (!item || item.id !== "herbsoup") return;\n\n    inputLocked.current = true;\n    const remainingQty = Math.max(0, item.quantity - 1);\n    const replacement: BagItem | null = remainingQty > 0 ? { ...item, quantity: remainingQty } : null;\n\n    const nextTable = tableItemsRef.current.slice();\n    const nextIngredients = craftIngSlotsRef.current.slice() as (BagItem | null)[];\n    let nextTool = craftToolRef.current;\n\n    if (srcSlot <= 11) nextTable[srcSlot] = replacement;\n    else if (srcSlot <= 14) nextIngredients[srcSlot - 12] = replacement;\n    else if (srcSlot === 15) nextTool = replacement;\n    else {\n      inputLocked.current = false;\n      return;\n    }\n\n    tableItemsRef.current = nextTable;\n    craftIngSlotsRef.current = nextIngredients;\n    craftToolRef.current = nextTool;\n    setTableItems(nextTable);\n    setCraftIngSlots(nextIngredients);\n    setCraftTool(nextTool);\n    setSelectedSoupSlot(null);\n    setTooltipVisible(false);\n\n    await Promise.all([\n      AsyncStorage.setItem(KITCHEN_TABLE_KEY, JSON.stringify(nextTable)),\n      AsyncStorage.setItem(SK.CRAFT_INGREDIENTS, JSON.stringify(nextIngredients)),\n      AsyncStorage.setItem(SK.CRAFT_TOOL_SLOT, JSON.stringify(nextTool)),\n    ]).catch(() => {});\n\n    audioManager.playSoundEffect('eat', { maxDurationMs: 4000 });\n    setFlyingItemId("herbsoup");\n    const player = layouts.current.player;\n    const toX = player ? player.x + player.w / 2 : absX;\n    const toY = player ? player.y + player.h / 2 : absY;\n    soupX.value = absX;\n    soupY.value = absY;\n    soupScale.value = 1;\n    soupVis.value = 1;\n    soupX.value = withTiming(toX, { duration: CONSUME_MS });\n    soupY.value = withTiming(toY, { duration: CONSUME_MS });\n    soupScale.value = withTiming(0.1, { duration: CONSUME_MS });\n    soupVis.value = withTiming(0, { duration: CONSUME_MS }, (done) => {\n      if (done) runOnJS(onNormalSoupConsumed)();\n    });\n\n    const oldSta = staminaCurrent;\n    const newSta = Math.min(oldSta + 20, playerStats.maximumStamina);\n    setStaminaCurrent(newSta);\n    staminaSV.value = withTiming(newSta, { duration: STA_MS });\n    AsyncStorage.setItem(SK.STAMINA, String(newSta)).catch(() => {});\n\n    const gained = Math.max(0, newSta - oldSta);\n    if (gained > 0) {\n      plusY.value = 0;\n      plusOp.value = 0;\n      plusOp.value = withTiming(1, { duration: FLOAT_FADE_IN_MS });\n      plusY.value = withTiming(-FLOAT_RISE_PX, { duration: FLOAT_MS });\n      setTimeout(() => {\n        plusOp.value = withTiming(0, { duration: FLOAT_FADE_OUT_MS });\n      }, FLOAT_MS - FLOAT_FADE_OUT_MS);\n\n      const steps = 20;\n      const stepMs = STA_MS / steps;\n      let count = 0;\n      staminaCountTimer.current = setInterval(() => {\n        count++;\n        const value = Math.round(oldSta + ((newSta - oldSta) * count) / steps);\n        setStaminaDisplay(Math.min(value, newSta));\n        if (count >= steps) {\n          clearInterval(staminaCountTimer.current!);\n          setStaminaDisplay(newSta);\n        }\n      }, stepMs);\n    } else {\n      setStaminaDisplay(newSta);\n    }\n\n    if (canUseRecipeSlots(tsRef.current)) setTimeout(updateCraftResultPreview, 50);\n  }\n\n  function onNormalSoupConsumed() {\n    inputLocked.current = false;\n    setSoupDragging(false);\n  }\n\n  /** Drop a generic Kitchen item. Source is supplied by the item's own GestureDetector. */\n  function handleCookingItemDrop(srcSlot: number, absX: number, absY: number) {'''
          k = replace_once(k, marker, helper, 'insert normal Herb Soup consumption')

          old_drop = '''    const draggedItem = getCookingItemAtSlot(srcSlot);\n    const playerRect = layouts.current.player;\n    if (rupertInDining && draggedItem?.id === "herbsoup" && playerRect && inRect(absX, absY, playerRect)) {\n      showPlayerBubble('\"I need to cook herb soup for the guest.\"');\n      return;\n    }\n\n    const bagRect = layouts.current.bag;'''
          new_drop = '''    const draggedItem = getCookingItemAtSlot(srcSlot);\n    const playerRect = layouts.current.player;\n    if (rupertInDining && draggedItem?.id === "herbsoup" && playerRect && inRect(absX, absY, playerRect)) {\n      showPlayerBubble('\"I need to cook herb soup for the guest.\"');\n      return;\n    }\n    if (!rupertInDining && draggedItem?.id === "herbsoup" && playerRect && inRect(absX, absY, playerRect)) {\n      void consumeHerbSoupNormally(srcSlot, absX, absY);\n      return;\n    }\n\n    const bagRect = layouts.current.bag;'''
          k = replace_once(k, old_drop, new_drop, 'wire normal Herb Soup drop to player')

          # 2) Guest tutorial completion makes Day 2 an evening in Dormitory,
          # so the player can end that day. Day 3+ keeps the normal dynamic rules.
          old_import = '''import { createSnapshot, discardRuntimeAndRestore } from "@/src/game/save-manager";'''
          new_import = '''import { createSnapshot, discardRuntimeAndRestore } from "@/src/game/save-manager";\nimport { loadGuestTutorialIntroStep } from "@/src/game/guest-tutorial";'''
          d = replace_once(d, old_import, new_import, 'Dormitory guest tutorial import')

          old_day = '''        // Day\n        const rawDay = await AsyncStorage.getItem(DSK.DAY_INDEX);\n        const di = rawDay !== null ? parseInt(rawDay, 10) : 0;\n        setDayIdx(di);\n'''
          new_day = '''        // Day\n        const rawDay = await AsyncStorage.getItem(DSK.DAY_INDEX);\n        const di = rawDay !== null ? parseInt(rawDay, 10) : 0;\n        setDayIdx(di);\n        const guestTutorialStep = await loadGuestTutorialIntroStep();\n'''
          d = replace_once(d, old_day, new_day, 'load guest tutorial step in Dormitory')

          old_resolve = '''        const { timeOfDay: resolvedTod, showEveningIntro } = resolveDormitoryTimeOfDay(\n          di, spent,\n          { firstSleepDone: fs, hasSeenEveThought: evt, hasEntered: rawHasEntered === "true", savedTimeOfDay: tod },\n        );\n        setTimeOfDay(resolvedTod);\n'''
          new_resolve = '''        const resolvedRoom = resolveDormitoryTimeOfDay(\n          di, spent,\n          { firstSleepDone: fs, hasSeenEveThought: evt, hasEntered: rawHasEntered === "true", savedTimeOfDay: tod },\n        );\n        // The first guest tutorial completes Day 2's required progression. Once it\n        // is finished, the player may sleep and move on to Day 3 even though Day 2\n        // originally began in the tutorial-controlled morning state.\n        const postGuestDayTwoEvening = di === 1 && guestTutorialStep === "service_complete";\n        const resolvedTod: TimeOfDay = postGuestDayTwoEvening ? "evening" : resolvedRoom.timeOfDay;\n        const showEveningIntro = postGuestDayTwoEvening ? false : resolvedRoom.showEveningIntro;\n        if (postGuestDayTwoEvening && tod !== "evening") {\n          await AsyncStorage.setItem(DSK.TIME_OF_DAY, "evening");\n        }\n        setTimeOfDay(resolvedTod);\n'''
          d = replace_once(d, old_resolve, new_resolve, 'unlock sleep after guest tutorial')

          kitchen.write_text(k)
          dormitory.write_text(d)
          PY

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/KitchenScreenBase.tsx frontend/app/dormitory.tsx
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "Fix post-guest eating and sleep"
          git push origin HEAD:fix/post-guest-eating-sleep
