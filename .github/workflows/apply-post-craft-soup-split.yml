name: Apply post-craft soup split patch

on:
  push:
    branches:
      - fix/post-craft-soup-split
    paths:
      - .github/workflows/apply-post-craft-soup-split.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-craft-soup-split
          fetch-depth: 0

      - name: Apply post-craft soup patch
        run: python .github/scripts/patch-post-craft-soup-split.py

      - name: Verify intended code is present
        run: |
          grep -F 'We made enough for two. Can you please split them into 2 bowls?' frontend/app/kitchen.tsx
          grep -F 'That smells delicious. Please pass me a bowl and dig in, too.' frontend/app/kitchen.tsx
          grep -F 'We wanted to share.' frontend/app/kitchen.tsx
          grep -F 'function createCookingSoupGesture' frontend/app/kitchen.tsx
          grep -F 'if (ts === "COOKING_SHARE_EAT") return null;' frontend/app/kitchen.tsx

      - name: Commit patched kitchen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx
          git commit -m "Teach post-craft soup splitting and fix soup drag"
          git push origin HEAD:fix/post-craft-soup-split
