name: Apply guest tutorial unlock gates

on:
  push:
    branches:
      - fix/guest-tutorial-unlocks

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-tutorial-unlocks
          fetch-depth: 0

      - name: Apply focused unlock changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'kitchen': Path('frontend/src/KitchenScreenBase.tsx'),
              'garden': Path('frontend/src/GardenScreenBase.tsx'),
          }
          text = {k: p.read_text() for k, p in files.items()}

          def rep(name, old, new, label):
              count = text[name].count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text[name] = text[name].replace(old, new, 1)

          # ── Kitchen: Dining is story-locked until the first guest tutorial reaches it.
          rep('kitchen',
'''import {
  guestTutorialKeepsRupertInDining,
  loadGuestTutorialIntroStep,
  saveGuestTutorialIntroStep,
} from "@/src/game/guest-tutorial";''',
'''import {
  guestTutorialHasReached,
  guestTutorialKeepsRupertInDining,
  loadGuestTutorialIntroStep,
  saveGuestTutorialIntroStep,
} from "@/src/game/guest-tutorial";''',
'Kitchen guest tutorial import')

          rep('kitchen',
'''// ── TEMP DEV (Point 5 – Dining Hall layout test) ────────────────────────────────
// Keep direct access for manual Expo layout testing; the story prompt below now
// supplies the real tutorial unlock/pulse path.
const DEV_DINING_TEST_ACCESS = true;

''',
'''// Dining Hall access is story-controlled. It remains visible but locked until
// the first guest tutorial explicitly sends the player there.

''',
'Remove Dining dev access')

          rep('kitchen',
'''  const [dormitoryUnlocked, setDormitoryUnlocked] = useState(false);
  const [gardenActive, setGardenActive] = useState(false);''',
'''  const [dormitoryUnlocked, setDormitoryUnlocked] = useState(false);
  const [diningUnlocked, setDiningUnlocked] = useState(false);
  const [gardenActive, setGardenActive] = useState(false);''',
'Kitchen Dining unlock state')

          rep('kitchen',
'''      if (cookingDone !== "true") {
        if (active) setRupertInDining(false);
        return;
      }
      const step = await loadGuestTutorialIntroStep();
      if (!active || tsRef.current !== "IDLE") return;
      setRupertInDining(guestTutorialKeepsRupertInDining(step));''',
'''      if (cookingDone !== "true") {
        if (active) {
          setRupertInDining(false);
          setDiningUnlocked(false);
        }
        return;
      }
      const step = await loadGuestTutorialIntroStep();
      if (!active || tsRef.current !== "IDLE") return;
      setRupertInDining(guestTutorialKeepsRupertInDining(step));
      setDiningUnlocked(guestTutorialHasReached(step, "dining_prompt"));''',
'Kitchen resume Dining unlock')

          rep('kitchen',
'''        if (initialCookingDone === "true") {
          const initialGuestStep = await loadGuestTutorialIntroStep();
          setRupertInDining(guestTutorialKeepsRupertInDining(initialGuestStep));
        } else {
          setRupertInDining(false);
        }''',
'''        if (initialCookingDone === "true") {
          const initialGuestStep = await loadGuestTutorialIntroStep();
          setRupertInDining(guestTutorialKeepsRupertInDining(initialGuestStep));
          setDiningUnlocked(guestTutorialHasReached(initialGuestStep, "dining_prompt"));
        } else {
          setRupertInDining(false);
          setDiningUnlocked(false);
        }''',
'Kitchen initial Dining unlock')

          rep('kitchen',
'''          const guestStep = await loadGuestTutorialIntroStep();
          setRupertInDining(guestTutorialKeepsRupertInDining(guestStep));''',
'''          const guestStep = await loadGuestTutorialIntroStep();
          setRupertInDining(guestTutorialKeepsRupertInDining(guestStep));
          setDiningUnlocked(guestTutorialHasReached(guestStep, "dining_prompt"));''',
'Kitchen focus Dining unlock')

          rep('kitchen',
'''    await saveGuestTutorialIntroStep("dining_intro").catch(() => {});
    setTutState("IDLE");''',
'''    await saveGuestTutorialIntroStep("dining_intro").catch(() => {});
    setDiningUnlocked(true);
    setTutState("IDLE");''',
'Kitchen unlock Dining on tutorial entry')

          if text['kitchen'].count('(isDiningBtn && DEV_DINING_TEST_ACCESS)') != 1:
              raise SystemExit('Kitchen Dining active condition did not match exactly once')
          text['kitchen'] = text['kitchen'].replace('(isDiningBtn && DEV_DINING_TEST_ACCESS)', '(isDiningBtn && diningUnlocked)', 1)

          if text['kitchen'].count('} else if (isDiningBtn && DEV_DINING_TEST_ACCESS) {') != 1:
              raise SystemExit('Kitchen Dining navigation condition did not match exactly once')
          text['kitchen'] = text['kitchen'].replace('} else if (isDiningBtn && DEV_DINING_TEST_ACCESS) {', '} else if (isDiningBtn && diningUnlocked) {', 1)

          # ── Garden: Well remains tutorial-usable; optional activities wait for service_complete.
          rep('garden',
'''import {
  guestTutorialKeepsRupertInDining,
  guestTutorialRupertHasLeftGarden,
  loadGuestTutorialIntroStep,
} from "@/src/game/guest-tutorial";''',
'''import {
  guestTutorialHasReached,
  guestTutorialKeepsRupertInDining,
  guestTutorialRupertHasLeftGarden,
  loadGuestTutorialIntroStep,
} from "@/src/game/guest-tutorial";''',
'Garden guest tutorial import')

          rep('garden',
'''  const [rupertInDining, setRupertInDining] = useState(false);
  const [rupertAwayFromGarden, setRupertAwayFromGarden] = useState(true);
  const [secondPlotUnlocked, setSecondPlotUnlocked] = useState(false);''',
'''  const [rupertInDining, setRupertInDining] = useState(false);
  const [rupertAwayFromGarden, setRupertAwayFromGarden] = useState(true);
  const [diningUnlocked, setDiningUnlocked] = useState(false);
  const [guestTutorialComplete, setGuestTutorialComplete] = useState(false);
  const [secondPlotUnlocked, setSecondPlotUnlocked] = useState(false);''',
'Garden unlock states')

          rep('garden',
'''        const guestTutorialStep = await loadGuestTutorialIntroStep();
        setRupertInDining(guestTutorialKeepsRupertInDining(guestTutorialStep));
        setRupertAwayFromGarden(guestTutorialRupertHasLeftGarden(guestTutorialStep));''',
'''        const guestTutorialStep = await loadGuestTutorialIntroStep();
        setRupertInDining(guestTutorialKeepsRupertInDining(guestTutorialStep));
        setRupertAwayFromGarden(guestTutorialRupertHasLeftGarden(guestTutorialStep));
        setDiningUnlocked(guestTutorialHasReached(guestTutorialStep, "dining_prompt"));
        setGuestTutorialComplete(guestTutorialStep === "service_complete");''',
'Garden load unlock states')

          rep('garden',
'''        <ActivityBar
          visible={showActivityBar}
          enabledActivities={["well", "collectWood", "collectStone", "workout"]}
          endurance={playerStats.endurance}
          onActivity={handleActivity}
          onLockedTap={handleLockedActivity}
        />''',
'''        <ActivityBar
          visible={showActivityBar}
          enabledActivities={guestTutorialComplete
            ? ["well", "collectWood", "collectStone", "workout"]
            : ["well"]}
          endurance={playerStats.endurance}
          onActivity={handleActivity}
          onLockedTap={handleLockedActivity}
        />''',
'Garden activity unlock list')

          rep('garden',
'''        ] as const).map((loc) => {
          const guestDormitoryBlocked = rupertInDining && loc.id === "dormitory";
          return (
            <TouchableOpacity
              key={loc.id}
              style={[styles.locBtn, guestDormitoryBlocked ? styles.locBtnActive : styles.locBtnLocked]}
              disabled={!guestDormitoryBlocked}
              onPress={guestDormitoryBlocked
                ? () => showPlayerBubble('"I need to cook herb soup for the guest."')
                : undefined}
              activeOpacity={0.8}
            >
              <Image
                source={loc.img}
                style={[styles.locBtnImg, !guestDormitoryBlocked && styles.locBtnImgLocked]}
                resizeMode="contain"
                resizeMethod="resize"
              />
            </TouchableOpacity>
          );
        })}''',
'''        ] as const).map((loc) => {
          const guestDormitoryBlocked = rupertInDining && loc.id === "dormitory";
          const diningAvailable = diningUnlocked && loc.id === "dining";
          const active = guestDormitoryBlocked || diningAvailable;
          const onPress = diningAvailable
            ? () => {
                audioManager.playSoundEffect('footstep', { maxDurationMs: 4000 });
                router.push("/dining");
              }
            : guestDormitoryBlocked
              ? () => showPlayerBubble('"I need to cook herb soup for the guest."')
              : undefined;
          return (
            <TouchableOpacity
              key={loc.id}
              style={[styles.locBtn, active ? styles.locBtnActive : styles.locBtnLocked]}
              disabled={!active}
              onPress={onPress}
              activeOpacity={0.8}
            >
              <Image
                source={loc.img}
                style={[styles.locBtnImg, !active && styles.locBtnImgLocked]}
                resizeMode="contain"
                resizeMethod="resize"
              />
            </TouchableOpacity>
          );
        })}''',
'Garden Dining navigation unlock')

          for name, path in files.items():
              path.write_text(text[name])
          PY

      - name: Commit focused unlock changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/KitchenScreenBase.tsx frontend/src/GardenScreenBase.tsx
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "Gate Dining and Garden activities by guest tutorial"
          git push origin HEAD:fix/guest-tutorial-unlocks
