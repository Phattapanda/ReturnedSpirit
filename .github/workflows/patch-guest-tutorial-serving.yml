name: Apply guest tutorial serving restrictions

on:
  push:
    branches:
      - feat/guest-tutorial-serving

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/guest-tutorial-serving
          fetch-depth: 0

      - name: Apply exact Point 9 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'garden': Path('frontend/app/garden.tsx'),
              'kitchen': Path('frontend/app/kitchen.tsx'),
              'dining': Path('frontend/app/dining.tsx'),
          }
          texts = {name: path.read_text() for name, path in files.items()}

          def replace_once(name: str, old: str, new: str, label: str):
              text = texts[name]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              texts[name] = text.replace(old, new, 1)

          # Garden: while Rupert remains in Dining Hall for the guest meal quest,
          # water fetching stays available but optional stamina/resource activities do not.
          replace_once(
              'garden',
              '''  function handleActivity(id: ActivityId) {\n    if (id === "well")         handleWellAction();\n    else if (id === "collectWood")  handleCollectWood();\n    else if (id === "collectStone") handleCollectStone();\n    else if (id === "workout")      handleWorkout();\n  }\n''',
              '''  function handleActivity(id: ActivityId) {\n    if (rupertInDining && id !== "well") {\n      showPlayerBubble('"I need to cook herb soup for the guest."');\n      return;\n    }\n    if (id === "well")              handleWellAction();\n    else if (id === "collectWood")  handleCollectWood();\n    else if (id === "collectStone") handleCollectStone();\n    else if (id === "workout")      handleWorkout();\n  }\n''',
              'Garden activity restrictions',
          )

          replace_once(
              'garden',
              '''  function handleKitchenTap() {\n    if (bubble) { dismissBubbleNoCallback(); }\n    // Leave-lock: only during GARDEN_PLOT_INTERACTIVE (before minimum task complete)\n''',
              '''  function handleKitchenTap() {\n    if (bubble) { dismissBubbleNoCallback(); }\n\n    // Point 9 guest meal quest: the old Tuesday tutorial gates must no longer\n    // trap the player in Garden. The empty bucket may still be back in Kitchen.\n    if (rupertInDining) {\n      audioManager.playSoundEffect('footstep', { maxDurationMs: 4000 });\n      router.replace("/kitchen");\n      return;\n    }\n\n    // Leave-lock: only during GARDEN_PLOT_INTERACTIVE (before minimum task complete)\n''',
              'Garden leave gate bypass',
          )

          replace_once(
              'garden',
              '''        ] as const).map((loc) => (\n          <TouchableOpacity key={loc.id} style={[styles.locBtn, styles.locBtnLocked]} disabled activeOpacity={0.8}>\n            <Image source={loc.img} style={[styles.locBtnImg, styles.locBtnImgLocked]} resizeMode="contain" resizeMethod="resize" />\n          </TouchableOpacity>\n        ))}\n''',
              '''        ] as const).map((loc) => {\n          const guestDormitoryBlocked = rupertInDining && loc.id === "dormitory";\n          return (\n            <TouchableOpacity\n              key={loc.id}\n              style={[styles.locBtn, guestDormitoryBlocked ? styles.locBtnActive : styles.locBtnLocked]}\n              disabled={!guestDormitoryBlocked}\n              onPress={guestDormitoryBlocked\n                ? () => showPlayerBubble('"I need to cook herb soup for the guest."')\n                : undefined}\n              activeOpacity={0.8}\n            >\n              <Image\n                source={loc.img}\n                style={[styles.locBtnImg, !guestDormitoryBlocked && styles.locBtnImgLocked]}\n                resizeMode="contain"\n                resizeMethod="resize"\n              />\n            </TouchableOpacity>\n          );\n        })}\n''',
              'Garden Dormitory rejection',
          )

          # Kitchen: keep the normal post-tutorial cooking system open, but prevent
          # wasting the guest's Herb Soup and reject Dormitory while the guest waits.
          replace_once(
              'kitchen',
              '''    const cur = tsRef.current;\n    if (!isKitchenItemInteractionState(cur)) return;\n    if (cur === "COOKING_UNPACK_WAIT" && srcSlot > 11) return;\n\n    const bagRect = layouts.current.bag;\n''',
              '''    const cur = tsRef.current;\n    if (!isKitchenItemInteractionState(cur)) return;\n    if (cur === "COOKING_UNPACK_WAIT" && srcSlot > 11) return;\n\n    const draggedItem = getCookingItemAtSlot(srcSlot);\n    const playerRect = layouts.current.player;\n    if (rupertInDining && draggedItem?.id === "herbsoup" && playerRect && inRect(absX, absY, playerRect)) {\n      showPlayerBubble('"I need to cook herb soup for the guest."');\n      return;\n    }\n\n    const bagRect = layouts.current.bag;\n''',
              'Kitchen guest soup self-eat rejection',
          )

          replace_once(
              'kitchen',
              '''            } else if (isDormBtn && dormitoryUnlocked) {\n              locOnPress = () => {\n                audioManager.playSoundEffect('walking-on-wood', { maxDurationMs: 5000 });\n                router.push("/dormitory");\n              };\n            } else if (isDiningBtn && DEV_DINING_TEST_ACCESS) {\n''',
              '''            } else if (isDormBtn && dormitoryUnlocked) {\n              locOnPress = rupertInDining\n                ? () => showPlayerBubble('"I need to cook herb soup for the guest."')\n                : () => {\n                    audioManager.playSoundEffect('walking-on-wood', { maxDurationMs: 5000 });\n                    router.push("/dormitory");\n                  };\n            } else if (isDiningBtn && DEV_DINING_TEST_ACCESS) {\n''',
              'Kitchen Dormitory rejection',
          )

          # Dining Hall: Dormitory remains visible/tappable during the guest meal quest,
          # but the player stays in Dining and gets the same thought bubble.
          replace_once(
              'dining',
              '''        {LOCS.map((loc) => {\n          const isCurrent = loc.id === "dining";\n          const locImg = IMG[`loc_${loc.id}` as keyof typeof IMG] as number | undefined;\n          const active = loc.nav || isCurrent;\n\n          const content = locImg ? (\n''',
              '''        {LOCS.map((loc) => {\n          const isCurrent = loc.id === "dining";\n          const guestDormitoryBlocked = tutorialStep === "ready_for_water" && loc.id === "dormitory";\n          const locImg = IMG[`loc_${loc.id}` as keyof typeof IMG] as number | undefined;\n          const active = loc.nav || isCurrent || guestDormitoryBlocked;\n\n          const content = locImg ? (\n''',
              'Dining Dormitory active state',
          )

          replace_once(
              'dining',
              '''          return (\n            <TouchableOpacity\n              key={loc.id}\n              style={[\n                styles.locBtn,\n                isCurrent ? styles.locBtnCurrent : (loc.nav ? styles.locBtnActive : styles.locBtnLocked),\n              ]}\n              disabled={!loc.nav || !!dialogLine}\n              onPress={loc.nav ? goToKitchen : undefined}\n              activeOpacity={0.8}\n            >\n              {content}\n            </TouchableOpacity>\n          );\n''',
              '''          const locationAction = loc.nav\n            ? goToKitchen\n            : guestDormitoryBlocked\n              ? () => showPlayerThought("I need to cook herb soup for the guest.")\n              : undefined;\n\n          return (\n            <TouchableOpacity\n              key={loc.id}\n              style={[\n                styles.locBtn,\n                isCurrent ? styles.locBtnCurrent : (active ? styles.locBtnActive : styles.locBtnLocked),\n              ]}\n              disabled={!locationAction || !!dialogLine}\n              onPress={locationAction}\n              activeOpacity={0.8}\n            >\n              {content}\n            </TouchableOpacity>\n          );\n''',
              'Dining Dormitory rejection action',
          )

          # Only write after every exact match has been validated.
          for name, path in files.items():
              path.write_text(texts[name])
          PY

      - name: Commit focused Point 9 patch
        shell: bash
        run: |
          if git diff --quiet -- frontend/app/garden.tsx frontend/app/kitchen.tsx frontend/app/dining.tsx; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/garden.tsx frontend/app/kitchen.tsx frontend/app/dining.tsx
          git commit -m "Simplify guest meal quest restrictions"
          git push origin HEAD:feat/guest-tutorial-serving
