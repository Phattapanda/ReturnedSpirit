name: Patch Tuesday trigger and tutorial save lock

on:
  push:
    branches:
      - fix/tuesday-trigger-and-tutorial-save-lock
    paths:
      - .github/workflows/patch-tuesday-trigger-save-lock.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tuesday-trigger-and-tutorial-save-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply Kitchen patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app/kitchen.tsx')
          s = path.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 match, found {count}: {old[:120]!r}')
              s = s.replace(old, new, 1)

          # 1) Initial Kitchen mount must also be able to start the Tuesday-morning prompt.
          replace_once(
              '''              } else {\n                setTs("IDLE");\n                tsRef.current = "IDLE";\n              }\n            }\n          } else {''',
              '''              } else {\n                setTutState("IDLE");\n                await maybeStartTuesdayMorningTutorial(800);\n              }\n            }\n          } else {''',
          )

          # 2) Centralize the Tuesday-morning gate so initial mount and later focus use identical logic.
          marker = '''  // Return-from-screen: refresh stats and detect post-garden dialog\n'''
          helper = '''  /** Start the Day-2 Kitchen prompt once the Kitchen is in a stable IDLE state. */\n  async function maybeStartTuesdayMorningTutorial(delayMs = 600): Promise<boolean> {\n    if (tsRef.current !== "IDLE") return false;\n\n    const [tuesdayShown, rawDay2, firstSleepDone] = await Promise.all([\n      AsyncStorage.getItem(SK.TUESDAY_MORNING_SHOWN),\n      AsyncStorage.getItem(SK.DAY_INDEX),\n      AsyncStorage.getItem(SK.FIRST_SLEEP_DONE),\n    ]);\n    const currentDay = rawDay2 ? parseInt(rawDay2, 10) : 0;\n    if (firstSleepDone !== "true" || currentDay < 1 || tuesdayShown === "true") return false;\n\n    // Persist before presenting the prompt so a second focus cannot start it twice.\n    await AsyncStorage.setItem(SK.TUESDAY_MORNING_SHOWN, "true");\n    setGardenActive(true);\n    setTutState("TUESDAY_KITCHEN_GARDEN_PROMPT");\n    setTimeout(() => {\n      showBubble(\n        '\"Good morning. Let\\'s go to the garden. We also need some water.\"',\n        "Rupert",\n        "GARDEN_PROMPT",\n        null,\n        () => {},\n        "bubble.tuesday.good_morning",\n      );\n    }, delayMs);\n    return true;\n  }\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'Expected one focus marker, found {s.count(marker)}')
          s = s.replace(marker, helper + marker, 1)

          old_tuesday = '''          // Tuesday morning prompt: day=1, first sleep done, not yet shown\n          const tuesdayShown = await AsyncStorage.getItem(SK.TUESDAY_MORNING_SHOWN);\n          const rawDay2 = await AsyncStorage.getItem(SK.DAY_INDEX);\n          const firstSleepDone = await AsyncStorage.getItem(SK.FIRST_SLEEP_DONE);\n          if (firstSleepDone === "true" && (rawDay2 ? parseInt(rawDay2, 10) : 0) >= 1 && tuesdayShown !== "true") {\n            await AsyncStorage.setItem(SK.TUESDAY_MORNING_SHOWN, "true");\n            setGardenActive(true);\n            setTutState("TUESDAY_KITCHEN_GARDEN_PROMPT");\n            setTimeout(() => {\n              showBubble(\n                '\"Good morning. Let\\'s go to the garden. We also need some water.\"',\n                "Rupert",\n                "GARDEN_PROMPT",\n                null,\n                () => {},\n                "bubble.tuesday.good_morning",\n              );\n            }, 600);\n            return;\n          }\n'''
          new_tuesday = '''          // Tuesday morning prompt also runs on the initial Kitchen mount via the same helper.\n          if (await maybeStartTuesdayMorningTutorial(600)) return;\n'''
          replace_once(old_tuesday, new_tuesday)

          # 3) Manual Kitchen saves are only allowed in stable IDLE state.
          replace_once(
              '''  async function handleManualSave() {\n    setShowMenu(false);\n    try {''',
              '''  async function handleManualSave() {\n    setShowMenu(false);\n    if (tsRef.current !== "IDLE") {\n      showPlayerBubble('\"I should finish this first.\"');\n      return;\n    }\n    try {''',
          )

          path.write_text(s)
          PY
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate Kitchen
        working-directory: frontend
        run: |
          npx eslint app/kitchen.tsx
          npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Start Tuesday prompt on first Kitchen entry and lock tutorial saves"
          git push
