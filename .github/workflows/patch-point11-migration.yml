name: Harden Point 11 migration flow

on:
  push:
    branches:
      - feat/post-guest-tutorial-upgrades

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-guest-tutorial-upgrades
      - name: Apply migration fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Kitchen: recover the one-time thought for an already completed Part 10 save.
          p=Path('frontend/app/kitchen.tsx')
          s=p.read_text()
          old='''  loadPostGuestTutorialState,\n  markUpgradeIntroSeen,'''
          new='''  loadPostGuestTutorialState,\n  markSecondPlotThoughtSeen,\n  markUpgradeIntroSeen,'''
          if s.count(old)!=1: raise SystemExit(f'kitchen import: {s.count(old)}')
          s=s.replace(old,new,1)

          old='''    await grantFarmerCarrotSeedOnce();\n    const state = await refreshPostGuestResources();\n    if (state.upgradeIntroSeen) return false;\n\n    postGuestIntroStartedRef.current = true;\n    setTimeout(() => {'''
          new='''    await grantFarmerCarrotSeedOnce();\n    let state = await refreshPostGuestResources();\n    if (!state.secondPlotThoughtSeen) {\n      showPlayerBubble('\"I could use a second garden bed for the carrot seed.\"');\n      state = await markSecondPlotThoughtSeen();\n      setPostGuestState(state);\n      delayMs = Math.max(delayMs, 2900);\n    }\n    if (state.upgradeIntroSeen) return false;\n\n    postGuestIntroStartedRef.current = true;\n    setTimeout(() => {'''
          if s.count(old)!=1: raise SystemExit(f'kitchen helper: {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          # Gift recovery: never replace an absent Garden inventory with only the new seed.
          p=Path('frontend/src/game/post-guest-tutorial.ts')
          s=p.read_text()
          old='''  let inventory: GardenInventoryItem[] = [];\n  try {'''
          new='''  let inventory: GardenInventoryItem[] = [\n    { id: "herbseed", itemType: "seed", name: "Herb Seed", quantity: 5 },\n    { id: "standard_fertilizer", itemType: "fertilizer", name: "Standard Fertilizer", quantity: 5 },\n  ];\n  try {'''
          if s.count(old)!=1: raise SystemExit(f'gift default: {s.count(old)}')
          s=s.replace(old,new,1)
          old='''  } catch {\n    inventory = [];\n  }'''
          new='''  } catch {\n    inventory = [\n      { id: "herbseed", itemType: "seed", name: "Herb Seed", quantity: 5 },\n      { id: "standard_fertilizer", itemType: "fertilizer", name: "Standard Fertilizer", quantity: 5 },\n    ];\n  }'''
          if s.count(old)!=1: raise SystemExit(f'gift catch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/kitchen.tsx frontend/src/game/post-guest-tutorial.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Harden post guest tutorial migration"
          git push origin HEAD:feat/post-guest-tutorial-upgrades
